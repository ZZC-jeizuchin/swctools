<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SwCTools · 音乐播放器</title>
  <style>
    /* 主站风格变量 */
    :root {
      --bg-body: #e8edf2;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: #bdd1e6;
      --title-color: #1e4b6e;
      --badge-bg: #d0e2f0;
      --badge-color: #2c6182;
      --cat-btn-bg: #d9e8f4;
      --cat-btn-border: #adc7e0;
      --cat-btn-color: #1a4059;
      --cat-btn-hover-bg: #c2d8ed;
      --jump-row-bg: #e7f0f9;
      --jump-row-border: #c1d6ea;
      --input-border: #b3cce2;
      --input-focus-border: #4f7fa3;
      --go-btn-bg: #4f7f9e;
      --go-btn-hover-bg: #3a6b8c;
      --tool-btn-bg: #cddef0;
      --tool-btn-border: #a3bed8;
      --tool-btn-color: #1a4765;
      --modal-overlay-bg: rgba(22, 50, 70, 0.25);
      --modal-card-bg: #f3f9ff;
      --link-item-bg: #d9e8f4;
      --link-item-border: #adc7e0;
      --drawer-panel-bg: #f3f9ff;
      --device-item-bg: #eaf2fc;
      --device-label-color: #1e4b6e;
      --device-value-color: #0d3450;
      --text-color: #173e58;
      --corner-text-color: #3a6a8e;
      --fps-bg: rgba(255, 255, 255, 0.6);
    }
    [data-theme="dark"] {
      --bg-body: #0a0f14;
      --panel-bg: rgba(13, 27, 42, 0.9);
      --panel-border: #1e3a5a;
      --title-color: #a0c4e8;
      --badge-bg: #1a3a5c;
      --badge-color: #b0d0f0;
      --cat-btn-bg: #1e3a5a;
      --cat-btn-border: #2a5a8a;
      --cat-btn-color: #c0d8f0;
      --cat-btn-hover-bg: #2a5a8a;
      --jump-row-bg: #122a3e;
      --jump-row-border: #1e4a6e;
      --input-border: #2a5a8a;
      --input-focus-border: #5a9ac0;
      --go-btn-bg: #2a6a9e;
      --go-btn-hover-bg: #1a4a7a;
      --tool-btn-bg: #1e3a5a;
      --tool-btn-border: #2a5a8a;
      --tool-btn-color: #c0d8f0;
      --modal-overlay-bg: rgba(0, 20, 40, 0.5);
      --modal-card-bg: #0d1b2a;
      --link-item-bg: #1e3a5a;
      --link-item-border: #2a5a8a;
      --drawer-panel-bg: #0d1b2a;
      --device-item-bg: #122a3e;
      --device-label-color: #a0c4e8;
      --device-value-color: #d0e0f0;
      --text-color: #c0d8f0;
      --corner-text-color: #7a9ab0;
      --fps-bg: rgba(0, 0, 0, 0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: var(--bg-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      flex-direction: column;
    }
    .corner-tl, .corner-tr, .corner-br {
      position: fixed; font-size: 0.75rem; color: var(--corner-text-color);
      opacity: 0.8; z-index: 3000; pointer-events: none;
    }
    .corner-tl { top: 12px; left: 16px; }
    .corner-tr {
      top: 12px; right: 20px;
      background: var(--fps-bg); padding: 4px 12px; border-radius: 24px;
      border: 1px solid var(--panel-border);
    }
    .corner-br { bottom: 12px; right: 20px; }
    .theme-toggle {
      position: fixed; bottom: 12px; left: 16px; font-size: 0.9rem;
      background: var(--tool-btn-bg); border: 1px solid var(--panel-border);
      color: var(--corner-text-color); padding: 5px 14px; border-radius: 32px;
      cursor: pointer; opacity: 0.85; transition: 0.2s; z-index: 3000; font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-toggle:hover { opacity: 1; background: var(--cat-btn-hover-bg); }
    .back-btn {
      position: fixed; top: 12px; left: 16px;
      background: var(--tool-btn-bg); border: 1px solid var(--panel-border);
      color: var(--corner-text-color); padding: 5px 14px; border-radius: 32px;
      text-decoration: none; font-size: 0.9rem; z-index: 3000; opacity: 0.85;
      font-weight: 500; transition: 0.2s;
    }
    .back-btn:hover { opacity: 1; background: var(--cat-btn-hover-bg); }

    .main-panel {
      max-width: 600px; width: 100%; background: var(--panel-bg);
      border-radius: 28px; box-shadow: 0 16px 30px -8px rgba(30,65,90,0.18);
      border: 1px solid var(--panel-border); padding: 30px 28px;
      display: flex; flex-direction: column; gap: 20px;
      margin-top: 40px;
    }
    .title-section {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--panel-border); padding-bottom: 12px;
    }
    .title-section h1 { font-size: 1.6rem; font-weight: 550; color: var(--title-color); }
    .badge {
      font-size: 0.9rem; color: var(--badge-color); background: var(--badge-bg);
      padding: 4px 12px; border-radius: 24px; border: 1px solid var(--cat-btn-border);
    }
    .player-controls {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .now-playing {
      flex: 1; font-size: 1rem; color: var(--text-color); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ctrl-btn {
      background: var(--tool-btn-bg); border: 1px solid var(--tool-btn-border);
      color: var(--tool-btn-color); padding: 8px 20px; border-radius: 24px;
      font-size: 0.9rem; font-weight: 550; cursor: pointer; transition: 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:hover { background: var(--cat-btn-hover-bg); }
    .ctrl-btn.play { background: var(--go-btn-bg); color: white; border: none; }
    .ctrl-btn.play:hover { background: var(--go-btn-hover-bg); }
    audio { width: 100%; margin-top: 8px; }

    .track-list {
      max-height: 55vh; overflow-y: auto; border-top: 1px solid var(--panel-border);
      padding-top: 8px;
    }
    .track-item {
      background: var(--link-item-bg); border: 1px solid var(--link-item-border);
      color: var(--cat-btn-color); padding: 12px 16px; border-radius: 12px;
      margin-bottom: 8px; cursor: pointer; transition: 0.15s;
      font-size: 0.95rem; font-weight: 500;
      -webkit-tap-highlight-color: transparent;
    }
    .track-item:hover { background: var(--cat-btn-hover-bg); border-color: #7fa5c5; }
    .track-item.active { background: var(--go-btn-bg); color: white; border-color: var(--go-btn-bg); }
    .loading, .error {
      text-align: center; padding: 20px; color: var(--text-color);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="corner-tl">不自由毋宁死 · Give me liberty or give me death</div>
  <div class="corner-tr" id="fpsDisplay">FPS: --</div>
  <div class="corner-br">made by ZZC-jeizuchin, github</div>

  <button class="theme-toggle" id="themeToggle">深色</button>
  <a class="back-btn" href="/index.html">← 返回主站</a>

  <div class="main-panel">
    <div class="title-section">
      <h1>🎵 音乐播放器</h1>
      <span class="badge">WAV 直链</span>
    </div>

    <div class="player-controls">
      <span class="now-playing" id="nowPlaying">未选择曲目</span>
      <button class="ctrl-btn play" id="btnPlay">▶ 播放</button>
      <button class="ctrl-btn" id="btnPrev">⏮ 上一首</button>
      <button class="ctrl-btn" id="btnNext">⏭ 下一首</button>
    </div>
    <audio id="audioPlayer" controls></audio>

    <div class="track-list" id="trackList">
      <div class="loading">正在加载曲目列表...</div>
    </div>
  </div>

  <script>
    (function() {
      // ========== 主题切换 ==========
      const themeToggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('swc_theme') || 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.textContent = currentTheme === 'light' ? '深色' : '亮色';
      themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('swc_theme', newTheme);
        themeToggle.textContent = newTheme === 'light' ? '深色' : '亮色';
      });

      // ========== FPS 显示 ==========
      const fpsDisplay = document.getElementById('fpsDisplay');
      let frameCount = 0, lastFpsUpdate = performance.now();
      function updateFPS() {
        frameCount++;
        const now = performance.now();
        if (now - lastFpsUpdate >= 1000) {
          fpsDisplay.textContent = `FPS: ${Math.round((frameCount * 1000) / (now - lastFpsUpdate))}`;
          frameCount = 0;
          lastFpsUpdate = now;
        }
        requestAnimationFrame(updateFPS);
      }
      requestAnimationFrame(updateFPS);

      // ========== 音乐播放逻辑 ==========
      const LIST_URL = 'https://os.743.world/wav/music.list';
      const trackListEl = document.getElementById('trackList');
      const audio = document.getElementById('audioPlayer');
      const nowPlayingEl = document.getElementById('nowPlaying');
      const btnPlay = document.getElementById('btnPlay');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      let tracks = [];      // { url, name }
      let currentIndex = -1;

      // 从直链提取文件名，去掉 .wav 后缀，并自动解码 URI 编码（中文显示）
      function extractName(url) {
        try {
          const path = new URL(url).pathname;
          const parts = path.split('/').filter(Boolean);
          if (parts.length === 0) return url;
          const filename = parts[parts.length - 1];
          return decodeURIComponent(filename.replace(/\.wav$/i, ''));
        } catch (e) {
          const fallback = url.split('/').pop().replace(/\.wav$/i, '') || url;
          return decodeURIComponent(fallback);
        }
      }

      // 加载曲目列表
      async function loadTrackList() {
        try {
          const response = await fetch(LIST_URL);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const text = await response.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length === 0) throw new Error('列表为空');

          tracks = lines.map(url => ({ url, name: extractName(url) }));
          renderTrackList();
        } catch (err) {
          trackListEl.innerHTML = `<div class="error">⚠️ 加载失败：${err.message}</div>`;
        }
      }

      // 渲染曲目列表
      function renderTrackList() {
        trackListEl.innerHTML = tracks.map((track, index) => `
          <div class="track-item${index === currentIndex ? ' active' : ''}" data-index="${index}">
            ${track.name}
          </div>
        `).join('');

        trackListEl.querySelectorAll('.track-item').forEach(el => {
          el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.index);
            playTrack(idx);
          });
        });
      }

      // 播放指定曲目
      function playTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentIndex = index;
        const track = tracks[index];
        audio.src = track.url;
        audio.load();
        audio.play().catch(() => {});
        nowPlayingEl.textContent = '正在播放：' + track.name;
        btnPlay.textContent = '⏸ 暂停';
        renderTrackList();
      }

      // 播放/暂停按钮
      btnPlay.addEventListener('click', () => {
        if (currentIndex === -1 && tracks.length > 0) {
          playTrack(0);
        } else if (audio.paused) {
          audio.play().catch(() => {});
          btnPlay.textContent = '⏸ 暂停';
        } else {
          audio.pause();
          btnPlay.textContent = '▶ 播放';
        }
      });

      // 上一首 / 下一首
      btnPrev.addEventListener('click', () => {
        if (tracks.length === 0) return;
        const prev = (currentIndex - 1 + tracks.length) % tracks.length;
        playTrack(prev);
      });
      btnNext.addEventListener('click', () => {
        if (tracks.length === 0) return;
        const next = (currentIndex + 1) % tracks.length;
        playTrack(next);
      });

      // 曲目结束自动下一首
      audio.addEventListener('ended', () => {
        if (tracks.length === 0) return;
        const next = (currentIndex + 1) % tracks.length;
        playTrack(next);
      });

      // 音频加载错误处理
      audio.addEventListener('error', () => {
        nowPlayingEl.textContent = '⚠️ 音频加载失败';
      });

      // 启动加载
      loadTrackList();
    })();
  </script>
</body>
</html>
