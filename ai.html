<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>SwC AI</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="googlebot" content="noindex, nofollow">
<meta name="baiduspider" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="ai.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <h2>对话</h2>
      <button id="btnNewConv" title="新对话">+</button>
      <button id="btnCloud" title="对话云同步">☁</button>
      <button id="btnDlAll" title="全部下载">↓</button>
      <button id="btnTheme" title="主题">◐</button>
    </div>
    <div class="sb-list" id="convList"></div>
  </aside>

  <div class="mask" id="sidebarMask"></div>
  <div class="mask" id="popupMask"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="btnMenu">☰</button>
      <a class="back-btn" href="index.html" title="返回主站">← 主站</a>
      <h1 id="convTitle">SwC AI</h1>
      <button class="chip empty" id="btnConfig" title="模型配置切换">
        <span class="l" id="configLabel">配置</span>
        <span class="a">▾</span>
      </button>
      <button class="chip empty" id="btnModel" title="模型选择">
        <span class="l" id="modelLabel">模型</span>
        <span class="a">▾</span>
      </button>
      <button class="chip" id="btnReason" title="推理强度">
        <span id="reasonLabel">默认</span>
        <span class="a">▾</span>
      </button>
      <button class="chip empty" id="btnSearch" title="搜索配置与联网开关">
        <span class="l" id="searchLabel">搜索</span>
        <span class="a">▾</span>
      </button>
      <button class="chip" id="btnDebug" title="调试模式">🐞 调试</button>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h2>SwC AI</h2>
        <p>顶栏「配置」管理模型，「搜索」管理联网搜索</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="input" placeholder="Enter 发送，Shift+Enter 换行" rows="1"></textarea>
        <button id="btnSend">发送</button>
      </div>
    </div>
  </main>
</div>

<div class="popup" id="configPopup" style="width:300px;">
  <div class="popup-head">
    <span style="flex:1;font-size:12px;color:var(--muted);font-weight:600;">模型配置</span>
    <button id="btnManageModelConfigs" title="管理配置">⚙</button>
  </div>
  <div class="popup-list" id="configList"></div>
</div>

<div class="popup" id="modelPopup" style="width:320px;">
  <div class="popup-head">
    <input id="modelSearch" placeholder="搜索模型...">
    <button id="btnRefreshModels" title="刷新">↻</button>
  </div>
  <div class="popup-list" id="modelListPanel"></div>
  <div class="popup-foot">
    <button id="btnShowManual">+ 手动输入模型名</button>
  </div>
  <div class="popup-manual" id="manualWrap">
    <input id="manualInput" placeholder="模型名称">
    <button id="btnManualConfirm">确定</button>
  </div>
</div>

<div class="popup" id="searchPopup" style="width:320px;">
  <div class="search-toggle-row">
    <input type="checkbox" id="searchEnabledCheck">
    <label for="searchEnabledCheck">启用联网搜索</label>
  </div>
  <div class="popup-list" id="searchConfigList"></div>
  <div class="popup-foot">
    <button id="btnManageSearchConfigs">管理搜索配置</button>
    <button id="btnNewSearchConfig">新建</button>
  </div>
</div>

<div class="popup" id="reasonPopup" style="width:180px;">
  <div class="popup-list" style="max-height:none;">
    <div class="popup-item" data-v="">默认</div>
    <div class="popup-item" data-v="none">None</div>
    <div class="popup-item" data-v="low">Low</div>
    <div class="popup-item" data-v="medium">Medium</div>
    <div class="popup-item" data-v="high">High</div>
    <div class="popup-item" data-v="xhigh">XHigh</div>
    <div class="popup-item" data-v="max">Max</div>
  </div>
</div>

<div class="popup" id="cloudPopup" style="width:360px;">
  <div class="popup-head">
    <span style="flex:1;font-size:12px;color:var(--muted);font-weight:600;">对话云同步</span>
    <button id="btnCloudRefresh" title="刷新">↻</button>
  </div>
  <div class="cloud-actions">
    <button class="primary" id="btnSyncAll">全部同步</button>
    <button id="btnCheckState">检查状态</button>
  </div>
  <div class="cloud-progress" id="cloudProgress"></div>
  <div class="popup-list" id="cloudList"></div>
</div>

<div class="conv-menu" id="convMenu">
  <button data-act="rename">重命名</button>
  <button data-act="download">下载</button>
  <button data-act="sync">同步</button>
  <button data-act="delete" class="danger">删除</button>
</div>

<div class="modal config-manager" id="modelManagerModal">
  <div class="modal-card">
    <h3>模型配置管理</h3>
    <div class="cloud-actions">
      <button class="primary" id="mmSyncAll">全部同步</button>
      <button id="mmCheckState">检查状态</button>
    </div>
    <div class="cloud-progress" id="mmProgress"></div>
    <div class="conf-list" id="modelManagerList"></div>
    <div class="conf-actions">
      <button id="mmAdd">新建配置</button>
      <button class="primary" id="mmClose">完成</button>
    </div>
  </div>
</div>

<div class="modal" id="modelEditModal">
  <div class="modal-card">
    <h3 id="meTitle">新建模型配置</h3>
    <label>配置名称</label>
    <input id="meName" placeholder="例如：DeepSeek 主力">
    <label>代理地址</label>
    <input id="meProxyUrl" placeholder="/api/aiapi">
    <div class="hint">同源 Pages Functions 路径，一般不改</div>
    <label>代理密码</label>
    <input id="meProxyPassword" type="password" placeholder="代理密码">
    <label>API 地址</label>
    <input id="meApiBase" placeholder="https://api.deepseek.com">
    <div class="hint">不带 /chat/completions，程序会自动拼接</div>
    <label>备用模型列表地址（可选）</label>
    <input id="meFallbackModelsUrl" placeholder="https://backup.example.com/v1/models">
    <div class="hint">完整的模型列表 URL，主 API 的 /models 失败时使用</div>
    <label>手动模型列表（可选）</label>
    <textarea id="meManualModels" placeholder="一行一个模型名"></textarea>
    <div class="hint">如果填写了，将跳过所有 URL 获取，直接从列表选择</div>
    <label>模型获取模式</label>
    <select id="meModelMode">
      <option value="auto">自动（主 API /models → 备用列表）</option>
      <option value="manual">仅手动列表</option>
      <option value="cloudflare">Cloudflare Workers AI</option>
    </select>
    <label>Cloudflare Account ID（仅 Cloudflare 模式）</label>
    <input id="meCfAccountId" placeholder="例如：023e105f4ecef8ad9ca31a8372d0c353">
    <label>API Key</label>
    <input id="meApiKey" type="password" placeholder="sk-...">
    <label>系统提示词</label>
    <textarea id="meSystem" placeholder="你是一个乐于助人的AI助手。"></textarea>
    <label>温度 (0 ~ 2，留空则不发送)</label>
    <input id="meTemperature" type="number" min="0" max="2" step="0.1" placeholder="留空使用模型默认值">
    <div class="checkbox-row">
      <input type="checkbox" id="meAutoCollapse">
      <label for="meAutoCollapse" style="margin:0;cursor:pointer;">推理内容自动折叠</label>
    </div>
    <label>上下文窗口 (tokens)</label>
    <input id="meCtxWindow" type="number" min="1000" step="1000" placeholder="64000">
    <label>摘要阈值 (%)</label>
    <input id="meSummaryThreshold" type="number" min="50" max="95" step="5" placeholder="75">
    <div class="modal-actions">
      <button id="meDelete" class="danger" style="display:none;">删除此配置</button>
      <button id="meCancel">取消</button>
      <button class="primary" id="meSave">保存</button>
    </div>
  </div>
</div>

<div class="modal config-manager" id="searchManagerModal">
  <div class="modal-card">
    <h3>搜索配置管理</h3>
    <div class="cloud-actions">
      <button class="primary" id="smSyncAll">全部同步</button>
      <button id="smCheckState">检查状态</button>
    </div>
    <div class="cloud-progress" id="smProgress"></div>
    <div class="conf-list" id="searchManagerList"></div>
    <div class="conf-actions">
      <button id="smAdd">新建配置</button>
      <button class="primary" id="smClose">完成</button>
    </div>
  </div>
</div>

<div class="modal" id="searchEditModal">
  <div class="modal-card">
    <h3 id="seTitle">新建搜索配置</h3>
    <label>配置名称</label>
    <input id="seName" placeholder="例如：Tavily 主力">
    <label>代理地址</label>
    <input id="seProxyUrl" placeholder="/api/aiapi">
    <label>代理密码</label>
    <input id="seProxyPassword" type="password" placeholder="代理密码（与 aiapi 相同）">
    <label>搜索提供商</label>
    <select id="seProvider">
      <option value="tavily">Tavily（AI 优化，每月 1000 免费积分）</option>
      <option value="serper">Serper（Google 结果，2500 次免费搜索）</option>
    </select>
    <label>Tavily API Key</label>
    <input id="seTavilyKey" type="password" placeholder="tvly-...">
    <label>Serper API Key</label>
    <input id="seSerperKey" type="password" placeholder="your-serper-key">
    <label>搜索模式</label>
    <select id="seMode">
      <option value="simple">简单模式（每次提问自动搜一次）</option>
      <option value="agent">Agent 模式（AI 自主决策）</option>
    </select>
    <div class="hint">Agent 模式需要模型支持 function calling；不支持时会自动降级</div>
    <label>最多搜索轮数（Agent 模式）</label>
    <input id="seMaxRounds" type="number" min="1" max="10" step="1" placeholder="3">
    <label>搜索行为提示（Agent 模式，可选）</label>
    <textarea id="seSystemHint" placeholder="例如：只在问题涉及最近一周事件时才搜索。"></textarea>
    <div class="checkbox-row">
      <input type="checkbox" id="seEnabled">
      <label for="seEnabled" style="margin:0;cursor:pointer;">默认启用联网搜索</label>
    </div>
    <div class="modal-actions">
      <button id="seDelete" class="danger" style="display:none;">删除此配置</button>
      <button id="seCancel">取消</button>
      <button class="primary" id="seSave">保存</button>
    </div>
  </div>
</div>

<div class="diag" id="diagModal">
  <div class="diag-box">
    <div class="title" id="diagTitle">诊断</div>
    <div id="diagBody"></div>
    <button onclick="document.getElementById('diagModal').classList.remove('show')">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="ai-core.js"></script>
<script src="ai-chat.js"></script>
<script src="ai-ui.js"></script>
<script src="ai-check.js"></script>
</body>
</html>
