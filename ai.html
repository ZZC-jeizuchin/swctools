<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>SwC AI</title>
<style>
:root {
  --bg: #e8edf2;
  --panel: #ffffff;
  --side: #dde7f0;
  --border: #bdd1e6;
  --text: #173e58;
  --muted: #5a7a94;
  --title: #1e4b6e;
  --btn: #d9e8f4;
  --btn-b: #adc7e0;
  --btn-h: #c2d8ed;
  --acc: #4f7f9e;
  --acc-h: #3a6b8c;
  --input-b: #b3cce2;
  --user-bg: #4f7f9e;
  --user-c: #ffffff;
  --ai-bg: #ffffff;
  --reason-bg: #f0f4f8;
  --code-bg: #eef3f8;
  --active: #c2d8ed;
  --danger: #c62828;
  --ok: #2e7d32;
}
[data-theme="dark"] {
  --bg: #0a0f14;
  --panel: #0d1b2a;
  --side: #0d1a28;
  --border: #1e3a5a;
  --text: #c0d8f0;
  --muted: #7a9ab0;
  --title: #a0c4e8;
  --btn: #1e3a5a;
  --btn-b: #2a5a8a;
  --btn-h: #2a5a8a;
  --acc: #2a6a9e;
  --acc-h: #1a4a7a;
  --input-b: #2a5a8a;
  --user-bg: #2a6a9e;
  --user-c: #ffffff;
  --ai-bg: #142838;
  --reason-bg: #0f1e32;
  --code-bg: #122a3e;
  --active: #1e3a5a;
  --danger: #ef5350;
  --ok: #66bb6a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app {
  display: flex;
  height: 100vh;
  height: 100dvh;
}

/* ─── 侧边栏 ─── */
.sidebar {
  width: 230px;
  flex-shrink: 0;
  background: var(--side);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: transform 0.22s ease;
  position: relative;
}
.sb-head {
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
}
.sb-head h2 {
  font-size: 12px;
  color: var(--muted);
  flex: 1;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}
.sb-head button {
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  padding: 3px 10px;
  font-size: 12px;
  cursor: pointer;
  border-radius: 6px;
}
.sb-head button:hover { background: var(--btn-h); }

.sb-list {
  flex: 1;
  overflow-y: auto;
}
.sb-item {
  padding: 9px 12px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sb-item:hover { background: var(--btn); }
.sb-item.active { background: var(--active); }
.sb-item .t {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sb-item .d {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 0 4px;
  font-size: 14px;
  border-radius: 4px;
}
.sb-item .d:hover { color: var(--text); }
.sb-item .rn {
  display: none;
  width: 100%;
  padding: 2px 6px;
  font-size: 12px;
  border: 1px solid var(--input-b);
  background: var(--bg);
  color: var(--text);
  outline: none;
  font-family: inherit;
  border-radius: 4px;
}
.sb-item.renaming .t, .sb-item.renaming .d { display: none; }
.sb-item.renaming .rn { display: block; }

/* ─── 主区 ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.menu-btn {
  display: none;
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 15px;
  border-radius: 6px;
  align-items: center;
  justify-content: center;
}
.topbar h1 {
  font-size: 13px;
  font-weight: 600;
  color: var(--title);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip {
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  max-width: 180px;
  overflow: hidden;
  border-radius: 6px;
}
.chip:hover { background: var(--btn-h); }
.chip .l {
  max-width: 130px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chip .a { font-size: 9px; opacity: 0.6; }
.chip.empty { color: var(--muted); }

/* ─── 聊天区 ─── */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.msg {
  max-width: 820px;
  margin: 0 auto 16px;
  display: flex;
  gap: 10px;
  position: relative;
}
.msg.user { flex-direction: row-reverse; }
.msg .wrap { max-width: 82%; min-width: 0; }
.msg .bubble {
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.65;
  word-wrap: break-word;
  overflow-wrap: break-word;
  border-radius: 10px;
}
.msg.user .bubble {
  background: var(--user-bg);
  color: var(--user-c);
  white-space: pre-wrap;
  border-bottom-right-radius: 4px;
}
.msg.ai .bubble {
  background: var(--ai-bg);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg .ava {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  border-radius: 50%;
}
.msg.user .ava { background: var(--acc); }
.msg.ai .ava { background: #14b8a6; }

.msg .ops {
  position: absolute;
  top: 4px;
  opacity: 0;
  transition: opacity 0.12s;
}
.msg:hover .ops { opacity: 1; }
.msg.user .ops { left: -28px; }
.msg.ai .ops { right: -28px; }
.msg .ops button {
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  width: 22px;
  height: 22px;
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: 6px;
}
.msg .ops button:hover { background: var(--btn-h); }

.reason {
  background: var(--reason-bg);
  border: 1px solid var(--border);
  margin-bottom: 6px;
  border-radius: 8px;
  overflow: hidden;
}
.reason summary {
  padding: 7px 12px;
  cursor: pointer;
  color: var(--muted);
  font-size: 12px;
  list-style: none;
  user-select: none;
}
.reason summary::-webkit-details-marker { display: none; }
.reason summary::before { content: '▸ '; font-size: 10px; }
.reason[open] summary::before { content: '▾ '; }
.reason .rc {
  padding: 8px 12px;
  color: var(--muted);
  font-style: italic;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  border-top: 1px solid var(--border);
}

.bubble p { margin: 0 0 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble pre {
  background: var(--code-bg);
  padding: 10px 12px;
  overflow-x: auto;
  margin: 8px 0;
  font-size: 13px;
  border-radius: 8px;
}
.bubble code {
  background: var(--code-bg);
  padding: 1px 5px;
  font-size: .9em;
  border-radius: 4px;
}
.bubble pre code { background: none; padding: 0; }
.bubble ul, .bubble ol { margin: 8px 0 8px 20px; }
.bubble li { margin: 3px 0; }
.bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 8px; color: var(--title); }
.bubble a { color: var(--acc); }
.bubble blockquote {
  border-left: 3px solid var(--border);
  padding-left: 10px;
  margin: 8px 0;
  opacity: .85;
}
.bubble table { border-collapse: collapse; margin: 8px 0; }
.bubble th, .bubble td {
  border: 1px solid var(--border);
  padding: 4px 8px;
}

/* ─── 输入区 ─── */
.input-area {
  flex: 0 0 auto;
  padding: 10px 20px 14px;
  background: var(--panel);
  border-top: 1px solid var(--border);
}
.input-box {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-box textarea {
  flex: 1;
  min-height: 40px;
  max-height: 160px;
  padding: 9px 14px;
  border: 1px solid var(--input-b);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  line-height: 1.45;
  resize: none;
  outline: none;
  border-radius: 20px;
}
.input-box textarea:focus { border-color: var(--acc); }
.input-box button {
  height: 40px;
  padding: 0 20px;
  border: 1px solid var(--acc);
  background: var(--acc);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 20px;
}
.input-box button:hover { background: var(--acc-h); }
.input-box button:disabled { opacity: .5; cursor: not-allowed; }
.input-box button.stop { background: var(--danger); border-color: var(--danger); }

.welcome {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.welcome h2 {
  font-size: 18px;
  margin-bottom: 8px;
  color: var(--title);
  font-weight: 600;
}

/* ─── Popup ─── */
.popup {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--border);
  z-index: 220;
  display: none;
  flex-direction: column;
  max-height: 70vh;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.popup.show { display: flex; }
.popup-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 6px;
  align-items: center;
}
.popup-head input {
  flex: 1;
  padding: 6px 10px;
  font-size: 12px;
  border: 1px solid var(--input-b);
  background: var(--bg);
  color: var(--text);
  outline: none;
  font-family: inherit;
  border-radius: 6px;
}
.popup-head input:focus { border-color: var(--acc); }
.popup-head button {
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-size: 13px;
  border-radius: 6px;
}
.popup-head button:hover { background: var(--btn-h); }
.popup-list {
  flex: 1;
  overflow-y: auto;
  max-height: 340px;
}
.popup-list::-webkit-scrollbar { width: 5px; }
.popup-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.popup-item {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}
.popup-item:hover { background: var(--btn); }
.popup-item.active { background: var(--active); }
.popup-item .n { flex: 1; }
.popup-item .chk { color: var(--ok); }

.popup-empty {
  padding: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}
.popup-foot { border-top: 1px solid var(--border); padding: 8px; }
.popup-foot button {
  width: 100%;
  padding: 7px;
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
}
.popup-foot button:hover { color: var(--acc); border-color: var(--acc); }

.popup-manual {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  display: none;
  gap: 6px;
}
.popup-manual.show { display: flex; }
.popup-manual input {
  flex: 1;
  padding: 6px 10px;
  font-size: 12px;
  border: 1px solid var(--input-b);
  background: var(--bg);
  color: var(--text);
  outline: none;
  font-family: inherit;
  border-radius: 6px;
}
.popup-manual button {
  padding: 6px 14px;
  background: var(--acc);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  border-radius: 6px;
}

/* 会话菜单 */
.conv-menu {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--border);
  z-index: 250;
  display: none;
  flex-direction: column;
  min-width: 140px;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  overflow: hidden;
}
.conv-menu.show { display: flex; }
.conv-menu button {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 9px 14px;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  font-family: inherit;
}
.conv-menu button:last-child { border-bottom: none; }
.conv-menu button:hover { background: var(--btn); }
.conv-menu button.danger { color: var(--danger); }

/* 云同步 */
.cloud-actions {
  padding: 8px 12px;
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
}
.cloud-actions button {
  flex: 1;
  padding: 7px;
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
}
.cloud-actions button:hover { background: var(--btn-h); }
.cloud-actions button.primary {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.cloud-actions button.primary:hover { background: var(--acc-h); }

.cloud-row {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.cloud-row .info { flex: 1; min-width: 0; }
.cloud-row .info .t {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cloud-row .info .m {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.cloud-row button {
  padding: 4px 10px;
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  border-radius: 6px;
}
.cloud-row button:hover { background: var(--btn-h); }
.cloud-row button.primary {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.cloud-row button.danger { color: var(--danger); }

/* ─── Modal ─── */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 16px;
}
.modal.show { display: flex; }
.modal-card {
  background: var(--panel);
  border: 1px solid var(--border);
  max-width: 560px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}
.modal-card h3 {
  margin-bottom: 16px;
  color: var(--title);
  font-size: 16px;
  font-weight: 600;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-card label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 14px;
  margin-bottom: 4px;
  font-weight: 500;
}
.modal-card input, .modal-card textarea, .modal-card select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--input-b);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  border-radius: 8px;
}
.modal-card input:focus, .modal-card textarea:focus, .modal-card select:focus {
  border-color: var(--acc);
}
.modal-card textarea { min-height: 60px; resize: vertical; }
.modal-card .hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.modal-actions button {
  padding: 8px 18px;
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  border-radius: 8px;
}
.modal-actions button.primary {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.modal-actions button:hover { opacity: .9; }
.modal-actions button.danger { color: var(--danger); }

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 13px;
}
.checkbox-row input[type=checkbox] { width: auto; margin: 0; }

/* 配置列表项 */
.conf-item {
  padding: 10px 14px;
  border: 1px solid var(--border);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
  border-radius: 8px;
  flex-wrap: wrap;
}
.conf-item:hover { background: var(--btn); }
.conf-item.active { background: var(--active); border-color: var(--acc); }
.conf-item .n { flex: 1; font-weight: 500; min-width: 100px; }
.conf-item .m {
  font-size: 11px;
  color: var(--muted);
  flex-basis: 100%;
  order: 3;
  margin-top: 4px;
}
.conf-item button {
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--btn-b);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  border-radius: 6px;
}
.conf-item button:hover { background: var(--btn); }
.conf-item button.danger { color: var(--danger); }

.config-manager .modal-card {
  max-width: 600px;
}
.config-manager .conf-list {
  max-height: 60vh;
  overflow-y: auto;
}
.config-manager .conf-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.config-manager .conf-actions button {
  flex: 1;
  padding: 9px;
  background: var(--btn);
  border: 1px solid var(--btn-b);
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  border-radius: 8px;
}
.config-manager .conf-actions button.primary {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.config-manager .conf-actions button:hover { opacity: .9; }

/* 诊断 */
.diag {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}
.diag.show { display: flex; }
.diag-box {
  background: #1e1e1e;
  color: #d4d4d4;
  font-family: 'Consolas', monospace;
  font-size: 12px;
  max-width: 900px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  padding: 18px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  border-radius: 10px;
}
.diag-box .title {
  color: #ff6b6b;
  margin-bottom: 10px;
  font-size: 14px;
}
.diag-box .l { color: #569cd6; }
.diag-box .v { color: #ce9178; }
.diag-box button {
  margin-top: 14px;
  padding: 7px 18px;
  background: #0e639c;
  color: #fff;
  border: none;
  cursor: pointer;
  font-family: inherit;
  border-radius: 6px;
}

.mask {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.3);
  z-index: 100;
}
.mask.show { display: block; }

#popupMask { z-index: 210; }

/* ─── 移动端竖屏 ─── */
@media (max-width: 768px) {
  .sidebar {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    transform: translateX(-100%);
    width: 260px;
  }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: flex; }
  .chip .l { max-width: 70px; }

  .msg .ops {
    opacity: 1;
    position: static;
    margin: 0 4px;
    align-self: flex-start;
  }
  .msg.user .ops, .msg.ai .ops { left: auto; right: auto; }

  .msg .wrap { max-width: 88%; }
  .chat { padding: 12px 12px; }
  .input-area { padding: 8px 12px 12px; }
  .input-box textarea { min-height: 38px; padding: 8px 12px; }
  .input-box button { height: 38px; padding: 0 16px; }

  .topbar { padding: 8px 10px; gap: 4px; }
  .topbar h1 { font-size: 12px; }

  .msg { gap: 6px; }
  .msg .bubble { padding: 9px 12px; font-size: 14px; }

  .popup {
    right: 8px !important;
    left: 8px !important;
    max-width: calc(100vw - 16px);
  }

  .modal { padding: 8px; }
  .modal-card { padding: 16px; max-height: 94vh; }

  .cloud-row .info .t { max-width: 140px; }
}

/* 横屏移动端保持桌面布局 */
@media (max-width: 768px) and (orientation: landscape) {
  .sidebar {
    position: static;
    transform: none !important;
    width: 200px;
  }
  .menu-btn { display: none !important; }
  .msg .ops {
    opacity: 0;
    position: absolute;
  }
  .msg:hover .ops { opacity: 1; }
  .msg.user .ops { left: -28px; right: auto; }
  .msg.ai .ops { right: -28px; left: auto; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <h2>对话</h2>
      <button id="btnNewConv" title="新对话">+</button>
      <button id="btnCloud" title="云同步">☁</button>
      <button id="btnDlAll" title="全部下载">↓</button>
      <button id="btnTheme" title="主题">◐</button>
    </div>
    <div class="sb-list" id="convList"></div>
  </aside>

  <div class="mask" id="sidebarMask"></div>
  <div class="mask" id="popupMask"></div>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="btnMenu">☰</button>
      <h1 id="convTitle">SwC AI</h1>
      <button class="chip empty" id="btnConfig">
        <span class="l" id="configLabel">配置</span>
        <span class="a">▾</span>
      </button>
      <button class="chip empty" id="btnModel">
        <span class="l" id="modelLabel">模型</span>
        <span class="a">▾</span>
      </button>

        <span class="a">▾</span>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">

      </div>
    </div>

    <div class="input-area">

</div>

<!-- 配置快速切换 Popup -->

<!-- 模型选择 -->

<!-- 会话操作菜单 -->

<!-- 配置管理 Modal -->

  <div class="modal-card">
    <h3>配置管理</h3>

<!-- 编辑单个配置 -->
<div class="modal" id="configEditModal">
  <div class="modal-card">
    <h3 id="configEditTitle">新建配置</h3>

    <label>配置名称</label>

<!-- 诊断 -->
<div class="diag" id="diagModal">
  <div class="diag-box">
    <div class="title" id="diagTitle">诊断</div>

    <button onclick="document.getElementById('diagModal').classList.remove('show')">关闭</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

<script>
(function () {
  "use strict";

  // ─── 主题 ───
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('swc_theme', t);
  }
  applyTheme(localStorage.getItem('swc_theme') || 'light');

  // ─── 工具 ───
  function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function md(t) {
    try { return DOMPurify.sanitize(marked.parse(t || '')); }
    catch { return esc(t || ''); }
  }
  function fmtTime(ts) {
    const d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString())
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function showDiag(title, lines) {
    document.getElementById('diagTitle').textContent = title;
    document.getElementById('diagBody').innerHTML = lines.map(l => {
      if (typeof l === 'string') return esc(l);
      return '<span class="l">' + esc(l.k) + '</span>: <span class="v">' + esc(String(l.v)) + '</span>';
    }).join('\n');
    document.getElementById('diagModal').classList.add('show');
  }
  function getToken() { return localStorage.getItem('swc_token') || ''; }

  // ─── Cookie ───
  function setCookie(name, value, days) {
    days = days || 365;
    const d = new Date();
    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + d.toUTCString() + '; path=/; SameSite=Lax';
  }
  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[2]) : '';
  }
  function delCookie(name) {
    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax';
  }

  // ─── 配置（每个配置独立 cookie）───
  const CFG_PREFIX = 'swc_ai_cfg_';
  const IDS_KEY = 'swc_ai_cfg_ids';
  const CUR_KEY = 'swc_ai_current';

  function defaultConfig(name) {
    return {
      id: uuid(),
      name: name || '配置 1',
      proxyUrl: '/api/aiapi',
      proxyPassword: '',
      apiBase: '',
      apiKey: '',
      systemPrompt: '你是一个乐于助人的AI助手。',
      temperature: 0.7,
      autoCollapseReason: true,
      ctxWindow: 64000,
      summaryThreshold: 75,
      model: ''
    };
  }

  function loadConfigs() {
    let ids = [];
    try {
      const raw = getCookie(IDS_KEY);
      if (raw) ids = JSON.parse(raw);
    } catch { ids = []; }
    const arr = [];
    for (const id of ids) {
      const c = getCookie(CFG_PREFIX + id);
      if (!c) continue;
      try { arr.push(JSON.parse(c)); } catch {}
    }
    return arr;
  }

  function saveAllConfigs(arr) {
    // 删除不在新列表里的旧 cookie
    let oldIds = [];
    try {
      const raw = getCookie(IDS_KEY);
      if (raw) oldIds = JSON.parse(raw);
    } catch {}
    const newIds = arr.map(c => c.id);
    for (const oid of oldIds) {
      if (!newIds.includes(oid)) delCookie(CFG_PREFIX + oid);
    }
    // 写每套配置
    for (const c of arr) {
      setCookie(CFG_PREFIX + c.id, JSON.stringify(c));
    }
    // 写 id 列表
    setCookie(IDS_KEY, JSON.stringify(newIds));
  }

  function deleteConfigCookie(id) {
    delCookie(CFG_PREFIX + id);
    let ids = [];
    try {
      const raw = getCookie(IDS_KEY);
      if (raw) ids = JSON.parse(raw);
    } catch {}
    ids = ids.filter(x => x !== id);
    setCookie(IDS_KEY, JSON.stringify(ids));
  }

  let configs = loadConfigs();
  let currentConfigId = getCookie(CUR_KEY) || '';

  if (configs.length === 0) {
    const c = defaultConfig('配置 1');
    configs = [c];
    currentConfigId = c.id;
    saveAllConfigs(configs);
    setCookie(CUR_KEY, c.id);
  }
  if (!configs.find(c => c.id === currentConfigId)) {
    currentConfigId = configs[0].id;
    setCookie(CUR_KEY, currentConfigId);
  }

  function curConfig() {
    return configs.find(c => c.id === currentConfigId) || configs[0];
  }
  function switchConfig(id) {
    currentConfigId = id;
    setCookie(CUR_KEY, id);
    updateConfigLabel();
    modelsCache = loadModels();
    renderModelList();
  }

  // ─── 模型缓存 ───
  function modelsCacheKey() { return 'swc_ai_models_' + currentConfigId; }
  function loadModels() {
    try { const r = localStorage.getItem(modelsCacheKey()); return r ? JSON.parse(r) : []; }
    catch { return []; }
  }
  function saveModels(list) { localStorage.setItem(modelsCacheKey(), JSON.stringify(list)); }
  let modelsCache = loadModels();

  // ─── 会话存储 ───
  const IDX_KEY = 'swc_ai_index';
  const P = 'swc_ai_conv:';
  const S = {
    idx() { try { const r = localStorage.getItem(IDX_KEY); return r ? JSON.parse(r) : []; } catch { return []; } },
    setIdx(v) { localStorage.setItem(IDX_KEY, JSON.stringify(v)); },
    add(id) { const a = this.idx(); if (!a.includes(id)) { a.unshift(id); this.setIdx(a); } },
    rem(id) { this.setIdx(this.idx().filter(x => x !== id)); },
    meta(id) { try { const r = localStorage.getItem(P + id + ':meta'); return r ? JSON.parse(r) : null; } catch { return null; } },
    setMeta(id, m) { localStorage.setItem(P + id + ':meta', JSON.stringify(m)); },
    delMeta(id) { localStorage.removeItem(P + id + ':meta'); },
    turn(id, n) { try { const r = localStorage.getItem(P + id + ':turn:' + n); return r ? JSON.parse(r) : null; } catch { return null; } },
    setTurn(id, n, t) { localStorage.setItem(P + id + ':turn:' + n, JSON.stringify(t)); },
    delTurn(id, n) { localStorage.removeItem(P + id + ':turn:' + n); },
    turns(id, c) { const a = []; for (let i = 0; i < c; i++) { const t = this.turn(id, i); if (t) a.push(t); } return a; },
    delConv(id) {
      const m = this.meta(id); const c = m?.turnCount || 0;
      for (let i = 0; i < c; i++) this.delTurn(id, i);
      this.delMeta(id); this.rem(id);
    },
    metas() { return this.idx().map(id => this.meta(id)).filter(Boolean); },
    rewriteTurns(id, turns) {
      const m = this.meta(id); if (!m) return;
      const old = m.turnCount || 0;
      for (let i = 0; i < Math.max(old, turns.length); i++) this.delTurn(id, i);
      turns.forEach((t, i) => this.setTurn(id, i, t));
      m.turnCount = turns.length;
      m.updatedAt = Date.now();
      this.setMeta(id, m);
    }
  };

  // ─── 会话状态 ───
  let curId = null, curMeta = null, curTurns = [];

  function newConv() {
    const c = curConfig();
    const id = uuid();
    const m = {
      id, title: '新对话',
      model: c.model || '',
      configId: c.id,
      configName: c.name,
      reasoning: '',
      createdAt: Date.now(), updatedAt: Date.now(),
      turnCount: 0, summary: ''
    };
    S.setMeta(id, m); S.add(id); return m;
  }
  function loadConv(id) {
    const m = S.meta(id); if (!m) return false;
    curId = id; curMeta = m; curTurns = S.turns(id, m.turnCount || 0);
    return true;
  }
  function delConv(id) {
    S.delConv(id);
    if (curId === id) {
      const r = S.idx();
      if (r.length > 0) loadConv(r[0]);
      else { curId = null; curMeta = null; curTurns = []; }
    }
  }

  // ─── 上下文管理 ───
  const CTX = {
    tk(t) {
      if (!t) return 0;
      let b = 0;
      for (let i = 0; i < t.length; i++) {
        const c = t.charCodeAt(i);
        b += c < 0x80 ? 1 : (c < 0x800 ? 2 : 3);
      }
      return Math.ceil(b / 3);
    },
    count(msgs) { let n = 0; for (const m of msgs) n += this.tk(m.content || '') + 4; return n; },
    build(turns, o) {
      o = o || {};
      const sys = o.systemPrompt || '';
      const sum = o.summary || '';
      const win = o.ctxWindow || 64000;
      const thr = o.summaryThreshold || 75;
      const max = Math.floor(win * thr / 100);
      const msgs = [];
      let fixed = 0;
      if (sys) { msgs.push({ role: 'system', content: sys }); fixed += this.tk(sys) + 4; }
      if (sum) { const s = '以下是之前对话的摘要：\n\n' + sum; msgs.push({ role: 'system', content: s }); fixed += this.tk(s) + 4; }
      const recent = []; let run = fixed;
      for (let i = turns.length - 1; i >= 0; i--) {
        const t = turns[i];
        const total = this.tk(t.user.content) + this.tk(t.assistant.content) + 8;
        if (run + total > max && recent.length >= 3) break;
        recent.unshift(t); run += total;
      }
      for (const t of recent) {
        msgs.push({ role: 'user', content: t.user.content });
        if (t.assistant.content) msgs.push({ role: 'assistant', content: t.assistant.content });
      }
      return { messages: msgs, usedTokens: run };
    }
  };

  // ─── DOM ───
  const chatEl = document.getElementById('chat');
  const welcomeEl = document.getElementById('welcome');
  const inputEl = document.getElementById('input');
  const btnSend = document.getElementById('btnSend');
  const convListEl = document.getElementById('convList');
  const convTitleEl = document.getElementById('convTitle');
  const btnConfig = document.getElementById('btnConfig');
  const configLabel = document.getElementById('configLabel');
  const btnModel = document.getElementById('btnModel');
  const modelLabel = document.getElementById('modelLabel');
  const btnReason = document.getElementById('btnReason');
  const reasonLabel = document.getElementById('reasonLabel');
  const configPopup = document.getElementById('configPopup');
  const modelPopup = document.getElementById('modelPopup');
  const reasonPopup = document.getElementById('reasonPopup');
  const cloudPopup = document.getElementById('cloudPopup');
  const cloudList = document.getElementById('cloudList');
  const popupMask = document.getElementById('popupMask');
  const modelListPanel = document.getElementById('modelListPanel');
  const modelSearchEl = document.getElementById('modelSearch');
  const manualWrap = document.getElementById('manualWrap');
  const manualInput = document.getElementById('manualInput');
  const convMenu = document.getElementById('convMenu');
  const sidebarEl = document.getElementById('sidebar');
  const sidebarMask = document.getElementById('sidebarMask');
  const btnMenu = document.getElementById('btnMenu');
  const configListEl = document.getElementById('configList');
  const configManagerList = document.getElementById('configManagerList');

  // ─── 平滑滚动 ───
  let isAtBottom = true, scrollPending = false;
  chatEl.addEventListener('scroll', () => {
    isAtBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 60;
  }, { passive: true });
  function autoScroll() {
    if (!isAtBottom || scrollPending) return;
    scrollPending = true;
    requestAnimationFrame(() => { scrollPending = false; chatEl.scrollTop = chatEl.scrollHeight; });
  }

  // ─── 渲染消息 ───
  function makeTurnEl(turn, turnIdx) {
    const frag = document.createDocumentFragment();

    const u = document.createElement('div');
    u.className = 'msg user';
    u.innerHTML = '<div class="ava">你</div><div class="wrap"><div class="bubble"></div></div><div class="ops"><button title="操作">···</button></div>';
    u.querySelector('.bubble').textContent = turn.user.content;
    u.querySelector('.ops button').addEventListener('click', (e) => {
      e.stopPropagation();
      openMsgMenu(e.currentTarget, turnIdx);
    });
    frag.appendChild(u);

    const a = document.createElement('div');
    a.className = 'msg ai';
    a.innerHTML = '<div class="ava">AI</div><div class="wrap"><div class="bubble"></div></div>';
    const wrap = a.querySelector('.wrap');
    const bubble = a.querySelector('.bubble');

    if (turn.assistant.reasoning_content) {
      const d = document.createElement('details');
      d.className = 'reason';
      d.innerHTML = '<summary>推理过程</summary><div class="rc"></div>';
      d.querySelector('.rc').textContent = turn.assistant.reasoning_content;
      wrap.insertBefore(d, bubble);
    }
    bubble.innerHTML = turn.assistant.content ? md(turn.assistant.content) : '';
    frag.appendChild(a);
    return frag;
  }

  // ─── 消息操作菜单 ───
  let msgMenu = null;
  function openMsgMenu(anchor, turnIdx) {
    closeMsgMenu();
    msgMenu = document.createElement('div');
    msgMenu.className = 'conv-menu show';
    msgMenu.innerHTML = '<button data-act="delete">删除这轮对话</button>';
    document.body.appendChild(msgMenu);
    const r = anchor.getBoundingClientRect();
    msgMenu.style.top = (r.bottom + 4) + 'px';
    msgMenu.style.left = Math.min(r.left, window.innerWidth - 160) + 'px';
    msgMenu.querySelector('[data-act="delete"]').addEventListener('click', () => {
      if (confirm('删除这轮对话？（用户消息和 AI 回复都会删除）')) {
        deleteTurn(turnIdx);
      }
      closeMsgMenu();
    });
    setTimeout(() => {
      document.addEventListener('click', closeMsgMenu, { once: true });
    }, 0);
  }
  function closeMsgMenu() {
    if (msgMenu && msgMenu.parentNode) msgMenu.parentNode.removeChild(msgMenu);
    msgMenu = null;
  }

  function deleteTurn(idx) {
    if (idx < 0 || idx >= curTurns.length) return;
    curTurns.splice(idx, 1);
    if (curId) S.rewriteTurns(curId, curTurns);
    renderChat();
  }

  // ─── 渲染 ───
  function renderChat() {
    chatEl.innerHTML = '';
    if (!curId || curTurns.length === 0) {
      chatEl.appendChild(welcomeEl);
      convTitleEl.textContent = 'SwC AI';
    } else {
      curTurns.forEach((t, i) => chatEl.appendChild(makeTurnEl(t, i)));
      convTitleEl.textContent = curMeta?.title || 'SwC AI';
    }
    updateConfigLabel();
    updateModelLabel();
    updateReasonLabel();
    renderConvList();
  }

  function updateConfigLabel() {
    const c = curConfig();
    configLabel.textContent = c ? c.name : '无配置';
    btnConfig.classList.toggle('empty', !c);
  }
  function updateModelLabel() {

  // ─── 获取模型 ───
  let fetchingModels = false;
  async function fetchModels(silent) {
    if (fetchingModels) return;
    const c = curConfig();
    if (!c.proxyUrl || !c.proxyPassword || !c.apiBase || !c.apiKey) {
      if (!silent) showDiag('配置不完整', [
        { k: '配置名', v: c.name },
        { k: '代理地址', v: c.proxyUrl || '(空)' },
        { k: '代理密码', v: c.proxyPassword ? '已填' : '(空)' },
        { k: 'API 地址', v: c.apiBase || '(空)' },
        { k: 'API Key', v: c.apiKey ? '已填' : '(空)' }
      ]);
      return;
    }
    fetchingModels = true;
    const btn = document.getElementById('btnRefreshModels');
    btn.disabled = true; btn.textContent = '…';
    const target = c.apiBase.replace(/\/+$/, '') + '/models';

    try {
      const res = await fetch(c.proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: c.proxyPassword,
          target, method: 'GET',
          headers: { 'Authorization': 'Bearer ' + c.apiKey }
        })
      });
      const bodyText = await res.text();
      if (!res.ok) {
        showDiag('获取模型失败 HTTP ' + res.status, [
          { k: '目标', v: target },
          { k: '状态', v: res.status },
          { k: '响应体', v: bodyText.slice(0, 2000) }
        ]);
        return;
      }
      let data;
      try { data = JSON.parse(bodyText); }
      catch {
        showDiag('响应不是 JSON', [
          { k: '目标', v: target },
          { k: '响应体', v: bodyText.slice(0, 2000) }
        ]);
        return;
      }
      let list = [];
      if (Array.isArray(data.data)) list = data.data.map(m => m.id || m.name).filter(Boolean);
      else if (Array.isArray(data.models)) list = data.models.map(m => m.id || m.name).filter(Boolean);
      else if (Array.isArray(data)) list = data.map(m => (typeof m === 'string' ? m : (m.id || m.name))).filter(Boolean);

      if (list.length === 0) {
        showDiag('未解析到模型', [
          { k: '目标', v: target },
          { k: '响应体', v: bodyText.slice(0, 2000) }
        ]);
        return;
      }
      modelsCache = list;
      saveModels(list);
      renderModelList();
      if (!curMeta?.model && !c.model) selectModel(list[0]);
    } catch (e) {
      showDiag('获取模型网络异常', [
        { k: '代理地址', v: c.proxyUrl },
        { k: '异常', v: e.name + ': ' + e.message }
      ]);
    } finally {
      fetchingModels = false;
      btn.disabled = false; btn.textContent = '↻';
    }
  }

  // ─── 发送 ───
  let ac = null, generating = false;
  function setGen(on) {
    generating = on;

    else { btnSend.textContent = '发送'; btnSend.classList.remove('stop'); }
  }

  async function send() {
    if (generating) { if (ac) ac.abort(); return; }
    const text = inputEl.value.trim();
    if (!text) return;

    const c = curConfig();
    if (!c.proxyUrl || !c.proxyPassword || !c.apiBase || !c.apiKey) {
      showDiag('配置不完整', [
        { k: '配置名', v: c.name },
        { k: '代理地址', v: c.proxyUrl || '(空)' },
        { k: '代理密码', v: c.proxyPassword ? '已填' : '(空)' },
        { k: 'API 地址', v: c.apiBase || '(空)' },
        { k: 'API Key', v: c.apiKey ? '已填' : '(空)' }
      ]);
      openConfigEdit(c);
      return;
    }

    const model = curMeta?.model || c.model;
    if (!model) {
      showDiag('未选择模型', ['点击顶栏「模型」选择或手动输入。']);
      btnModel.click();
      return;
    }

    if (!curId) {
      const m = newConv();
      curId = m.id; curMeta = m; curTurns = [];
    }

    const ti = curTurns.length;
    const turn = { user: { content: text }, assistant: { content: '', reasoning_content: '' }, ts: Date.now() };
    curTurns.push(turn);

    if (curMeta.turnCount === 0) {
      const t = text.replace(/\s+/g, ' ').trim();
      curMeta.title = t.length > 20 ? t.slice(0, 20) + '…' : (t || '新对话');
    }
    curMeta.turnCount = curTurns.length;
    curMeta.updatedAt = Date.now();
    curMeta.model = curMeta.model || model;
    S.setMeta(curId, curMeta);

    inputEl.value = '';
    inputEl.style.height = 'auto';
    if (welcomeEl.parentNode) welcomeEl.remove();

    const u = document.createElement('div');
    u.className = 'msg user';
    u.innerHTML = '<div class="ava">你</div><div class="wrap"><div class="bubble"></div></div>';
    u.querySelector('.bubble').textContent = text;
    chatEl.appendChild(u);

    const a = document.createElement('div');
    a.className = 'msg ai';
    a.innerHTML = '<div class="ava">AI</div><div class="wrap"><div class="bubble"></div></div>';
    const wrap = a.querySelector('.wrap');
    const bubble = a.querySelector('.bubble');
    chatEl.appendChild(a);

    convTitleEl.textContent = curMeta.title;
    renderConvList();
    isAtBottom = true;
    chatEl.scrollTop = chatEl.scrollHeight;

    const ctx = CTX.build(curTurns.slice(0, -1), {
      systemPrompt: c.systemPrompt,
      summary: curMeta.summary || '',
      ctxWindow: c.ctxWindow || 64000,
      summaryThreshold: c.summaryThreshold || 75
    });
    ctx.messages.push({ role: 'user', content: text });

    const body = { model, messages: ctx.messages, stream: true };
    const t = parseFloat(c.temperature);
    if (!isNaN(t)) body.temperature = t;
    const re = curMeta.reasoning || '';
    if (re) body.reasoning_effort = re;

    ac = new AbortController();
    setGen(true);

    let reasonEl = null, reasonContentEl = null, autoCollapsed = false;

    try {
      const res = await fetch(c.proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: c.proxyPassword,
          target: c.apiBase.replace(/\/+$/, '') + '/chat/completions',
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + c.apiKey,
            'Content-Type': 'application/json'
          },
          body
        }),
        signal: ac.signal
      });

      if (!res.ok) {
        const t2 = await res.text();
        showDiag('对话失败 HTTP ' + res.status, [
          { k: '配置', v: c.name },
          { k: '目标', v: c.apiBase + '/chat/completions' },
          { k: '状态', v: res.status + ' ' + res.statusText },
          { k: '响应体', v: t2.slice(0, 3000) }
        ]);
        throw new Error('HTTP ' + res.status);
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const raw of lines) {
          const line = raw.trim();
          if (!line.startsWith('data:')) continue;
          const p = line.slice(5).trim();
          if (!p || p === '[DONE]') continue;
          try {
            const j = JSON.parse(p);
            const d = j.choices?.[0]?.delta || j.choices?.[0]?.message || {};

            if (typeof d.reasoning_content === 'string' && d.reasoning_content) {
              turn.assistant.reasoning_content += d.reasoning_content;
              if (!reasonEl) {
                reasonEl = document.createElement('details');
                reasonEl.className = 'reason';
                reasonEl.open = true;
                reasonEl.innerHTML = '<summary>推理过程</summary><div class="rc"></div>';
                reasonContentEl = reasonEl.querySelector('.rc');
                wrap.insertBefore(reasonEl, bubble);
              }
              reasonContentEl.textContent = turn.assistant.reasoning_content;
              autoScroll();
            }
            if (typeof d.thinking === 'string' && d.thinking) {
              turn.assistant.reasoning_content = (turn.assistant.reasoning_content || '') + d.thinking;
              if (!reasonEl) {
                reasonEl = document.createElement('details');
                reasonEl.className = 'reason';
                reasonEl.open = true;
                reasonEl.innerHTML = '<summary>推理过程</summary><div class="rc"></div>';
                reasonContentEl = reasonEl.querySelector('.rc');
                wrap.insertBefore(reasonEl, bubble);
              }
              reasonContentEl.textContent = turn.assistant.reasoning_content;
              autoScroll();
            }
            if (typeof d.content === 'string' && d.content) {
              if (reasonEl && c.autoCollapseReason !== false && !autoCollapsed) {
                reasonEl.open = false; autoCollapsed = true;
              }
              turn.assistant.content += d.content;
              bubble.innerHTML = md(turn.assistant.content);
              autoScroll();
            }
          } catch {}
        }
      }

      if (!turn.assistant.content && !turn.assistant.reasoning_content) {
        turn.assistant.content = '（无内容返回）';
        bubble.innerHTML = md(turn.assistant.content);
      }

      S.setTurn(curId, ti, turn);
      curMeta.updatedAt = Date.now();
      S.setMeta(curId, curMeta);

    } catch (err) {
      if (err.name === 'AbortError') {
        if (!turn.assistant.content && !turn.assistant.reasoning_content) {
          turn.assistant.content = '（已停止）';
          bubble.innerHTML = md(turn.assistant.content);
        }
      } else {
        if (!turn.assistant.content) {
          turn.assistant.content = '⚠ ' + err.message;
          bubble.innerHTML = md(turn.assistant.content);
        }
      }
      S.setTurn(curId, ti, turn);
      curMeta.updatedAt = Date.now();
      S.setMeta(curId, curMeta);
    } finally {
      setGen(false);
      ac = null;
    }
  }

      apiBase: document.getElementById('ceApiBase').value.trim(),
      apiKey: document.getElementById('ceApiKey').value,
      systemPrompt: document.getElementById('ceSystem').value,
      temperature: parseFloat(document.getElementById('ceTemperature').value) || 0.7,
      autoCollapseReason: document.getElementById('ceAutoCollapse').checked,
      ctxWindow: parseInt(document.getElementById('ceCtxWindow').value) || 64000,
      summaryThreshold: parseInt(document.getElementById('ceSummaryThreshold').value) || 75,
      model: ''
    };
    if (editingConfigId) {
      const idx = configs.findIndex(c => c.id === editingConfigId);
      if (idx >= 0) {
        newCfg.model = configs[idx].model || '';
        configs[idx] = newCfg;
      }
    } else {
      configs.push(newCfg);
      currentConfigId = newCfg.id;
      setCookie(CUR_KEY, newCfg.id);
    }
    // 保存单套 + 更新 ids 列表
    setCookie(CFG_PREFIX + newCfg.id, JSON.stringify(newCfg));
    setCookie(IDS_KEY, JSON.stringify(configs.map(c => c.id)));
    closeConfigEdit();
    updateConfigLabel();
    updateModelLabel();
    renderConfigList();
  });

  // ─── 云同步 ───
  async function cloudApi(opts) {
    const token = getToken();
    if (!token) {
      showDiag('未登录', ['云端同步需要登录状态，请先在主站登录。']);
      return null;
    }
    let url = '/api/ai-conv';
    const params = [];
    if (opts.type) params.push('type=' + encodeURIComponent(opts.type));
    if (opts.id) params.push('id=' + encodeURIComponent(opts.id));
    if (params.length) url += '?' + params.join('&');

    const fetchOpts = { method: opts.method || 'GET', headers: { 'Authorization': 'Bearer ' + token } };
    if (opts.body) {
      fetchOpts.headers['Content-Type'] = 'application/json';
      fetchOpts.body = JSON.stringify(opts.body);
    }

    try {
      const res = await fetch(url, fetchOpts);
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      if (!res.ok) {
        showDiag('云同步失败 HTTP ' + res.status, [
          { k: 'URL', v: url },
          { k: '状态', v: res.status },
          { k: '响应体', v: text.slice(0, 2000) }
        ]);
        return null;
      }
      return data;
    } catch (e) {
      showDiag('云同步网络异常', [
        { k: 'URL', v: url },
        { k: '异常', v: e.name + ': ' + e.message }
      ]);
      return null;
    }
  }

  async function syncConfigsToCloud() {
    const r = await cloudApi({ type: 'config', method: 'PUT', body: { configs } });
    if (r) alert('配置已同步到云端');
  }

  async function uploadConv(id) {
    const m = S.meta(id); if (!m) return false;
    const turns = S.turns(id, m.turnCount || 0);
    const r = await cloudApi({ method: 'PUT', body: { id, conversation: { ...m, turns } } });
    return !!r;
  }
  async function uploadAll() {
    const ids = S.idx();
    if (ids.length === 0) { alert('没有本地会话'); return; }
    let ok = 0, fail = 0;
    for (const id of ids) {
      const r = await uploadConv(id);
      if (r) ok++; else fail++;
    }
    alert('上传完成：成功 ' + ok + '，失败 ' + fail);
    if (cloudPopup.classList.contains('show')) refreshCloudList();
  }
  async function downloadConvFromCloud(id) {
    const data = await cloudApi({ id });
    if (!data || !data.conversation) return;
    const c = data.conversation;
    const meta = {
      id, title: c.title || '未命名',
      model: c.model || '', configId: c.configId || '', configName: c.configName || '',
      reasoning: c.reasoning || '',
      createdAt: c.createdAt || Date.now(), updatedAt: c.updatedAt || Date.now(),
      turnCount: Array.isArray(c.turns) ? c.turns.length : 0,
      summary: c.summary || ''
    };
    const old = S.meta(id);
    if (old && old.turnCount) {
      for (let i = 0; i < old.turnCount; i++) S.delTurn(id, i);
    }
    S.setMeta(id, meta);
    (c.turns || []).forEach((t, i) => S.setTurn(id, i, t));
    S.add(id);
    alert('已下载：' + meta.title);
    renderChat();
  }
  async function deleteCloudConv(id) {
    if (!confirm('删除云端这个对话？')) return;
    const r = await cloudApi({ method: 'DELETE', id });
    if (r) { alert('已删除'); refreshCloudList(); }
  }
  async function refreshCloudList() {
    cloudList.innerHTML = '<div class="popup-empty">加载中…</div>';
    const data = await cloudApi({});
    if (!data || !Array.isArray(data.index)) {
      cloudList.innerHTML = '<div class="popup-empty">加载失败</div>';
      return;
    }
    if (data.index.length === 0) {
      cloudList.innerHTML = '<div class="popup-empty">云端暂无对话</div>';
      return;
    }
    cloudList.innerHTML = '';
    data.index.forEach(item => {
      const row = document.createElement('div');
      row.className = 'cloud-row';
      row.innerHTML = '<div class="info"><div class="t">' + esc(item.title || '未命名') + '</div>' +
        '<div class="m">' + (item.turnCount || 0) + ' 轮 · ' + fmtTime(item.updatedAt || 0) + '</div></div>';
      const dl = document.createElement('button');
      dl.className = 'primary'; dl.textContent = '下载';
      dl.addEventListener('click', () => downloadConvFromCloud(item.id));
      const del = document.createElement('button');
      del.className = 'danger'; del.textContent = '删除';
      del.addEventListener('click', () => deleteCloudConv(item.id));
      row.appendChild(dl); row.appendChild(del);
      cloudList.appendChild(row);
    });
  }

  document.getElementById('btnCloud').addEventListener('click', (e) => {
    e.stopPropagation();
    if (cloudPopup.classList.contains('show')) { closeAllPopups(); return; }
    cloudPopup.classList.add('show');
    popupMask.classList.add('show');
    cloudPopup.style.top = '50px';
    cloudPopup.style.right = '16px';
    cloudPopup.style.left = 'auto';
    refreshCloudList();
  });
  cloudPopup.addEventListener('click', e => e.stopPropagation());
  document.getElementById('btnCloudRefresh').addEventListener('click', refreshCloudList);
  document.getElementById('btnUploadCurrent').addEventListener('click', async () => {
    if (!curId) { alert('没有当前对话'); return; }
    const ok = await uploadConv(curId);
    if (ok) { alert('已上传'); refreshCloudList(); }
  });
  document.getElementById('btnUploadAll').addEventListener('click', uploadAll);

  // ─── 侧边栏 ───
  function openSidebar() { sidebarEl.classList.add('open'); sidebarMask.classList.add('show'); }
  function closeSidebar() { sidebarEl.classList.remove('open'); sidebarMask.classList.remove('show'); }
  btnMenu.addEventListener('click', openSidebar);
  sidebarMask.addEventListener('click', closeSidebar);

  // ─── 新对话 ───
  document.getElementById('btnNewConv').addEventListener('click', () => {
    if (generating && !confirm('正在生成，确定新建？')) return;
    if (ac) ac.abort();
    curId = null; curMeta = null; curTurns = [];
    renderChat();
    if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
      closeSidebar();
    }
    inputEl.focus();
  });

  // ─── 全部下载 ───
  document.getElementById('btnDlAll').addEventListener('click', downloadAll);

  // ─── 发送事件 ───
  btnSend.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // ─── 启动 ───
  (async function init() {
    const ids = S.idx();
    if (ids.length > 0) loadConv(ids[0]);
    renderChat();
    updateConfigLabel();

    if (getToken()) {
      try {
        const r = await cloudApi({ type: 'config' });
        if (r && Array.isArray(r.configs) && r.configs.length > 0) {
          const localIsEmpty = configs.length === 1 && !configs[0].apiKey;
          if (localIsEmpty) {
            configs = r.configs;
            saveAllConfigs(configs);
            currentConfigId = configs[0].id;
            setCookie(CUR_KEY, currentConfigId);
            updateConfigLabel();
            updateModelLabel();
          }
        }
      } catch {}
    }
  })();

})();
</script>
</body>
