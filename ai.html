<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>SwC AI</title>
<style>
:root {
  --bg:#e8edf2; --panel:#ffffff; --side:#dde7f0; --border:#bdd1e6;
  --text:#173e58; --muted:#5a7a94; --title:#1e4b6e;
  --btn:#d9e8f4; --btn-b:#adc7e0; --btn-h:#c2d8ed;
  --acc:#4f7f9e; --acc-h:#3a6b8c; --input-b:#b3cce2;
  --user-bg:#4f7f9e; --user-c:#ffffff; --ai-bg:#ffffff;
  --reason-bg:#f0f4f8; --code-bg:#eef3f8; --active:#c2d8ed;
  --danger:#c62828; --ok:#2e7d32; --mark:#f5b300;
  --sync-synced:#2e7d32; --sync-ln:#f57c00; --sync-cn:#1976d2;
  --sync-only:#90a4ae; --sync-unknown:#cfd8dc; --sync-fail:#c62828;
}
[data-theme="dark"] {
  --bg:#0a0f14; --panel:#0d1b2a; --side:#0d1a28; --border:#1e3a5a;
  --text:#c0d8f0; --muted:#7a9ab0; --title:#a0c4e8;
  --btn:#1e3a5a; --btn-b:#2a5a8a; --btn-h:#2a5a8a;
  --acc:#2a6a9e; --acc-h:#1a4a7a; --input-b:#2a5a8a;
  --user-bg:#2a6a9e; --user-c:#ffffff; --ai-bg:#142838;
  --reason-bg:#0f1e32; --code-bg:#122a3e; --active:#1e3a5a;
  --danger:#ef5350; --ok:#66bb6a; --mark:#ffb74d;
  --sync-synced:#66bb6a; --sync-ln:#ffb74d; --sync-cn:#64b5f6;
  --sync-only:#78909c; --sync-unknown:#37474f; --sync-fail:#ef5350;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%; overflow:hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size:14px; line-height:1.5; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
.app { display:flex; height:100vh; height:100dvh; }

.sidebar {
  width:240px; flex-shrink:0; background:var(--side); border-right:1px solid var(--border);
  display:flex; flex-direction:column; z-index:200; transition:transform 0.22s ease;
  position:relative;
}
.sb-head { padding:10px 12px; display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--border); }
.sb-head h2 { font-size:12px; color:var(--muted); flex:1; text-transform:uppercase; letter-spacing:1px; font-weight:600; }
.sb-head button {
  background:var(--btn); border:1px solid var(--btn-b); color:var(--text);
  padding:3px 10px; font-size:12px; cursor:pointer; border-radius:6px;
}
.sb-head button:hover { background:var(--btn-h); }
.sb-list { flex:1; overflow-y:auto; }
.sb-item {
  padding:9px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:6px;
}
.sb-item:hover { background:var(--btn); }
.sb-item.active { background:var(--active); }
.sb-item .sync-icon { width:14px; text-align:center; flex-shrink:0; font-size:12px; font-weight:bold; }
.sb-item .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-item .d {
  background:transparent; border:none; color:var(--muted); cursor:pointer;
  padding:0 4px; font-size:14px; border-radius:4px;
}
.sb-item .d:hover { color:var(--text); }
.sb-item .rn {
  display:none; width:100%; padding:2px 6px; font-size:12px;
  border:1px solid var(--input-b); background:var(--bg); color:var(--text);
  outline:none; font-family:inherit; border-radius:4px;
}
.sb-item.renaming .t, .sb-item.renaming .d, .sb-item.renaming .sync-icon { display:none; }
.sb-item.renaming .rn { display:block; }
.sb-item .spin {
  width:12px; height:12px; border:2px solid var(--border); border-top-color:var(--acc);
  border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0;
}
@keyframes spin { to { transform:rotate(360deg); } }

.sync-icon[data-state="synced"] { color:var(--sync-synced); }
.sync-icon[data-state="local-newer"] { color:var(--sync-ln); }
.sync-icon[data-state="cloud-newer"] { color:var(--sync-cn); }
.sync-icon[data-state="local-only"] { color:var(--sync-only); }
.sync-icon[data-state="cloud-only"] { color:var(--sync-only); }
.sync-icon[data-state="unknown"] { color:var(--sync-unknown); }
.sync-icon[data-state="failed"] { color:var(--sync-fail); }

.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar {
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);
}
.menu-btn {
  display:none; background:var(--btn); border:1px solid var(--btn-b); color:var(--text);
  width:32px; height:32px; cursor:pointer; font-size:15px; border-radius:6px;
  align-items:center; justify-content:center;
}
.back-btn {
  background:var(--btn); border:1px solid var(--btn-b); color:var(--text);
  padding:5px 12px; font-size:12px; cursor:pointer;
  border-radius:6px; text-decoration:none;
  display:inline-flex; align-items:center; gap:4px;
  white-space:nowrap;
}
.back-btn:hover { background:var(--btn-h); }
.topbar h1 {
  font-size:13px; font-weight:600; color:var(--title); flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-left:2px;
}
.chip {
  background:var(--btn); border:1px solid var(--btn-b); color:var(--text);
  padding:5px 10px; font-size:12px; cursor:pointer;
  display:flex; align-items:center; gap:4px; white-space:nowrap;
  max-width:180px; overflow:hidden; border-radius:6px;
}
.chip:hover { background:var(--btn-h); }
.chip .l { max-width:130px; overflow:hidden; text-overflow:ellipsis; }
.chip .a { font-size:9px; opacity:0.6; }
.chip.empty { color:var(--muted); }
.chip.error { color:var(--danger); border-color:var(--danger); }

.chat { flex:1; overflow-y:auto; padding:16px 20px; }
.chat::-webkit-scrollbar { width:6px; }
.chat::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.msg { max-width:820px; margin:0 auto 16px; display:flex; gap:10px; position:relative; }
.msg.user { flex-direction:row-reverse; }
.msg .wrap { max-width:82%; min-width:0; display:flex; flex-direction:column; }
.msg.user .wrap { align-items:flex-end; }
.msg .bubble {
  padding:10px 14px; font-size:14px; line-height:1.65;
  word-wrap:break-word; overflow-wrap:break-word; border-radius:10px;
}
.msg.user .bubble { background:var(--user-bg); color:var(--user-c); white-space:pre-wrap; border-bottom-right-radius:4px; }
.msg.ai .bubble { background:var(--ai-bg); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg .ava {
  width:28px; height:28px; flex-shrink:0; display:flex; align-items:center;
  justify-content:center; font-size:12px; font-weight:600; color:#fff; border-radius:50%;
}
.msg.user .ava { background:var(--acc); }
.msg.ai .ava { background:#14b8a6; }

.msg-actions {
  display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;
}
.msg.user .msg-actions { justify-content:flex-end; }
.msg-actions button {
  background:transparent; border:1px solid var(--border); color:var(--muted);
  padding:3px 10px; font-size:12px; cursor:pointer;
  border-radius:4px; font-family:inherit; transition:0.12s;
  -webkit-tap-highlight-color:transparent;
}
.msg-actions button:hover { background:var(--btn); color:var(--text); }
.msg-actions button:active { background:var(--btn-h); }
.msg.marked .bubble { box-shadow: 0 0 0 2px var(--mark) inset; }
.msg.marked .msg-actions button[data-act="mark"] {
  color:var(--mark); border-color:var(--mark); font-weight:600;
}

.reason {
  background:var(--reason-bg); border:1px solid var(--border); margin-bottom:6px;
  border-radius:8px; overflow:hidden; width:100%;
}
.reason summary {
  padding:7px 12px; cursor:pointer; color:var(--muted); font-size:12px;
  list-style:none; user-select:none;
}
.reason summary::-webkit-details-marker { display:none; }
.reason summary::before { content:'▸ '; font-size:10px; }
.reason[open] summary::before { content:'▾ '; }
.reason .rc {
  padding:8px 12px; color:var(--muted); font-style:italic; white-space:pre-wrap;
  word-break:break-word; font-size:13px; border-top:1px solid var(--border);
}

.bubble p { margin:0 0 8px; }
.bubble p:last-child { margin-bottom:0; }
.bubble pre { background:var(--code-bg); padding:10px 12px; overflow-x:auto; margin:8px 0; font-size:13px; border-radius:8px; }
.bubble code { background:var(--code-bg); padding:1px 5px; font-size:.9em; border-radius:4px; }
.bubble pre code { background:none; padding:0; }
.bubble ul, .bubble ol { margin:8px 0 8px 20px; }
.bubble li { margin:3px 0; }
.bubble h1, .bubble h2, .bubble h3 { margin:12px 0 8px; color:var(--title); }
.bubble a { color:var(--acc); }
.bubble blockquote { border-left:3px solid var(--border); padding-left:10px; margin:8px 0; opacity:.85; }
.bubble table { border-collapse:collapse; margin:8px 0; }
.bubble th, .bubble td { border:1px solid var(--border); padding:4px 8px; }

.input-area { flex:0 0 auto; padding:10px 20px 14px; background:var(--panel); border-top:1px solid var(--border); }
.input-box { max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
.input-box textarea {
  flex:1; min-height:40px; max-height:160px; padding:9px 14px;
  border:1px solid var(--input-b); background:var(--bg); color:var(--text);
  font-size:14px; font-family:inherit; line-height:1.45; resize:none; outline:none;
  border-radius:20px;
}
.input-box textarea:focus { border-color:var(--acc); }
.input-box button {
  height:40px; padding:0 20px; border:1px solid var(--acc);
  background:var(--acc); color:#fff; font-size:13px; cursor:pointer;
  font-family:inherit; border-radius:20px;
}
.input-box button:hover { background:var(--acc-h); }
.input-box button:disabled { opacity:.5; cursor:not-allowed; }
.input-box button.stop { background:var(--danger); border-color:var(--danger); }

.welcome { text-align:center; padding:60px 20px; color:var(--muted); }
.welcome h2 { font-size:18px; margin-bottom:8px; color:var(--title); font-weight:600; }

.popup {
  position:fixed; background:var(--panel); border:1px solid var(--border);
  z-index:220; display:none; flex-direction:column; max-height:70vh; overflow:hidden;
  border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.1);
}
.popup.show { display:flex; }
.popup-head {
  padding:8px 12px; border-bottom:1px solid var(--border);
  display:flex; gap:6px; align-items:center;
}
.popup-head input {
  flex:1; padding:6px 10px; font-size:12px;
  border:1px solid var(--input-b); background:var(--bg); color:var(--text);
  outline:none; font-family:inherit; border-radius:6px;
}
.popup-head input:focus { border-color:var(--acc); }
.popup-head button {
  background:var(--btn); border:1px solid var(--btn-b); color:var(--text);
  width:28px; height:28px; cursor:pointer; font-size:13px; border-radius:6px;
}
.popup-head button:hover { background:var(--btn-h); }
.popup-list { flex:1; overflow-y:auto; max-height:340px; }
.popup-list::-webkit-scrollbar { width:5px; }
.popup-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.popup-item {
  padding:8px 12px; cursor:pointer; font-size:13px;
  display:flex; align-items:center; gap:6px;
  border-bottom:1px solid var(--border); word-break:break-all;
}
.popup-item:hover { background:var(--btn); }
.popup-item.active { background:var(--active); }
.popup-item .n { flex:1; }
.popup-item .chk { color:var(--ok); }
.popup-empty { padding:24px; text-align:center; font-size:12px; color:var(--muted); }
.popup-foot { border-top:1px solid var(--border); padding:8px; }
.popup-foot button {
  width:100%; padding:7px; background:transparent; border:1px dashed var(--border);
  color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit; border-radius:6px;
}
.popup-foot button:hover { color:var(--acc); border-color:var(--acc); }
.popup-manual {
  padding:8px 12px; border-top:1px solid var(--border); display:none; gap:6px;
}
.popup-manual.show { display:flex; }
.popup-manual input {
  flex:1; padding:6px 10px; font-size:12px;
  border:1px solid var(--input-b); background:var(--bg); color:var(--text);
  outline:none; font-family:inherit; border-radius:6px;
}
.popup-manual button {
  padding:6px 14px; background:var(--acc); color:#fff; border:none;
  cursor:pointer; font-size:12px; font-family:inherit; border-radius:6px;
}

.conv-menu {
  position:fixed; background:var(--panel); border:1px solid var(--border);
  z-index:250; display:none; flex-direction:column; min-width:140px;
  border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.12); overflow:hidden;
}
.conv-menu.show { display:flex; }
.conv-menu button {
  background:transparent; border:none; color:var(--text);
  padding:9px 14px; text-align:left; cursor:pointer; font-size:13px;
  border-bottom:1px solid var(--border); font-family:inherit;
}
.conv-menu button:last-child { border-bottom:none; }
.conv-menu button:hover { background:var(--btn); }
.conv-menu button.danger { color:var(--danger); }

.cloud-actions { padding:8px 12px; display:flex; gap:8px; border-bottom:1px solid var(--border); }
.cloud-actions button {
  flex:1; padding:7px; background:var(--btn); border:1px solid var(--btn-b);
  color:var(--text); font-size:12px; cursor:pointer; font-family:inherit; border-radius:6px;
}
.cloud-actions button:hover { background:var(--btn-h); }
.cloud-actions button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
.cloud-actions button.primary:hover { background:var(--acc-h); }

.cloud-progress {
  display:none; padding:8px 12px; font-size:12px; color:var(--muted);
  border-bottom:1px solid var(--border); background:var(--code-bg);
}
.cloud-progress.show { display:block; }

.cloud-row {
  padding:9px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px; font-size:12px;
}
.cloud-row .sync-icon { width:14px; text-align:center; font-weight:bold; }
.cloud-row .info { flex:1; min-width:0; }
.cloud-row .info .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cloud-row .info .m { font-size:11px; color:var(--muted); margin-top:2px; }
.cloud-row button {
  padding:4px 10px; background:var(--btn); border:1px solid var(--btn-b);
  color:var(--text); cursor:pointer; font-size:11px; font-family:inherit; border-radius:6px;
}
.cloud-row button:hover { background:var(--btn-h); }

.modal {
  position:fixed; inset:0; background:rgba(0,0,0,.4);
  display:none; align-items:center; justify-content:center;
  z-index:300; padding:16px;
}
.modal.show { display:flex; }
.modal-card {
  background:var(--panel); border:1px solid var(--border);
  max-width:560px; width:100%; max-height:90vh; overflow-y:auto;
  padding:20px; border-radius:14px; box-shadow:0 8px 40px rgba(0,0,0,0.15);
}
.modal-card h3 {
  margin-bottom:16px; color:var(--title); font-size:16px; font-weight:600;
  padding-bottom:12px; border-bottom:1px solid var(--border);
}
.modal-card label {
  display:block; font-size:12px; color:var(--muted);
  margin-top:14px; margin-bottom:4px; font-weight:500;
}
.modal-card input, .modal-card textarea, .modal-card select {
  width:100%; padding:8px 12px; border:1px solid var(--input-b);
  background:var(--bg); color:var(--text); font-size:13px;
  font-family:inherit; outline:none; border-radius:8px;
}
.modal-card input:focus, .modal-card textarea:focus, .modal-card select:focus { border-color:var(--acc); }
.modal-card textarea { min-height:60px; resize:vertical; }
.modal-card .hint { font-size:11px; color:var(--muted); margin-top:3px; }
.modal-actions {
  display:flex; justify-content:flex-end; gap:8px;
  margin-top:18px; padding-top:14px; border-top:1px solid var(--border);
}
.modal-actions button {
  padding:8px 18px; background:var(--btn); border:1px solid var(--btn-b);
  color:var(--text); cursor:pointer; font-size:12px; font-family:inherit; border-radius:8px;
}
.modal-actions button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
.modal-actions button:hover { opacity:.9; }
.modal-actions button.danger { color:var(--danger); }
.checkbox-row { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:13px; }
.checkbox-row input[type=checkbox] { width:auto; margin:0; }

.conf-item {
  padding:10px 14px; border:1px solid var(--border); margin-bottom:8px;
  display:flex; align-items:center; gap:8px; font-size:13px;
  cursor:pointer; border-radius:8px; flex-wrap:wrap;
}
.conf-item:hover { background:var(--btn); }
.conf-item.active { background:var(--active); border-color:var(--acc); }
.conf-item .sync-icon { width:14px; text-align:center; font-weight:bold; flex-shrink:0; }
.conf-item .n { flex:1; font-weight:500; min-width:100px; }
.conf-item .m { font-size:11px; color:var(--muted); flex-basis:100%; order:3; margin-top:4px; }
.conf-item button {
  padding:4px 10px; background:transparent; border:1px solid var(--btn-b);
  color:var(--text); cursor:pointer; font-size:11px; font-family:inherit; border-radius:6px;
}
.conf-item button:hover { background:var(--btn); }

.config-manager .modal-card { max-width:600px; }
.config-manager .conf-list { max-height:50vh; overflow-y:auto; }
.config-manager .conf-actions {
  display:flex; gap:8px; margin-top:16px; padding-top:14px;
  border-top:1px solid var(--border);
}
.config-manager .conf-actions button {
  flex:1; padding:9px; background:var(--btn); border:1px solid var(--btn-b);
  color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; border-radius:8px;
}
.config-manager .conf-actions button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
.config-manager .conf-actions button:hover { opacity:.9; }
.config-manager .cloud-actions {
  margin-top:0;
  border-bottom:1px solid var(--border);
  border-top:none;
  padding:0 0 10px 0;
}
.config-manager .cloud-progress {
  margin-top:-10px;
  margin-bottom:10px;
  border-radius:6px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.diag {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  display:none; align-items:center; justify-content:center;
  z-index:9999; padding:20px;
}
.diag.show { display:flex; }
.diag-box {
  background:#1e1e1e; color:#d4d4d4; font-family:'Consolas', monospace; font-size:12px;
  max-width:900px; width:100%; max-height:90vh; overflow:auto; padding:18px;
  white-space:pre-wrap; word-break:break-all; line-height:1.5; border-radius:10px;
}
.diag-box .title { color:#ff6b6b; margin-bottom:10px; font-size:14px; }
.diag-box .l { color:#569cd6; }
.diag-box .v { color:#ce9178; }
.diag-box button {
  margin-top:14px; padding:7px 18px; background:#0e639c; color:#fff;
  border:none; cursor:pointer; font-family:inherit; border-radius:6px;
}

.mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:100; }
.mask.show { display:block; }
#popupMask { z-index:210; }

.toast {
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
  background:rgba(0,0,0,.8); color:#fff; padding:8px 16px;
  border-radius:20px; font-size:13px; z-index:99999;
  pointer-events:none; opacity:0; transition:opacity .2s;
}
.toast.show { opacity:1; }

@media (max-width: 768px) {
  .sidebar { position:absolute; top:0; left:0; bottom:0; transform:translateX(-100%); width:260px; }
  .sidebar.open { transform:translateX(0); }
  .menu-btn { display:flex; }
  .chip .l { max-width:70px; }
  .msg .wrap { max-width:88%; }
  .chat { padding:12px 12px; }
  .input-area { padding:8px 12px 12px; }
  .input-box textarea { min-height:38px; padding:8px 12px; }
  .input-box button { height:38px; padding:0 16px; }
  .topbar { padding:8px 10px; gap:4px; }
  .topbar h1 { font-size:12px; }
  .back-btn { padding:4px 8px; font-size:11px; }
  .msg { gap:6px; }
  .msg .bubble { padding:9px 12px; font-size:14px; }
  .msg-actions button { padding:4px 10px; font-size:12px; }
  .popup { right:8px !important; left:8px !important; max-width:calc(100vw - 16px); }
  .modal { padding:8px; }
  .modal-card { padding:16px; max-height:94vh; }
  .cloud-row .info .t { max-width:140px; }
}
@media (max-width: 768px) and (orientation: landscape) {
  .sidebar { position:static; transform:none !important; width:200px; }
  .menu-btn { display:none !important; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

<script>
(function () {
  "use strict";

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('swc_theme', t);
  }
  applyTheme(localStorage.getItem('swc_theme') || 'light');

  function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  //here
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString())
      return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function showDiag(title, lines) {
    document.getElementById('diagTitle').textContent = title;
    document.getElementById('diagBody').innerHTML = lines.map(l => {
      if (typeof l === 'string') return esc(l);
      return '<span class="l">' + esc(l.k) + '</span>: <span class="v">' + esc(String(l.v)) + '</span>';
    }).join('\n');
    document.getElementById('diagModal').classList.add('show');
  }
  function getToken() { return localStorage.getItem('swc_token') || ''; }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
  }

  // ─── Cookie ───
  function setCookie(name, value, days) {
    days = days || 365;
    const d = new Date();
    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + d.toUTCString() + '; path=/; SameSite=Lax';
  }
  function getCookie(name) {
    const m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[2]) : '';
  }
  function delCookie(name) {
    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax';
  }

  // ═══════════════════════════════════════════════════════
  // 配置
  // ═══════════════════════════════════════════════════════
  const CFG_PREFIX = 'swc_ai_cfg_';
  const CFG_IDX_KEY = 'swc_ai_cfg_index';
  const CUR_KEY = 'swc_ai_current';

  function defaultConfig(name) {
    return {
      id: uuid(),
      name: name || '配置 1',
      proxyUrl: '/api/aiapi',
      proxyPassword: '',
      apiBase: '',
      fallbackModelsUrl: '',
      manualModels: '',
      modelMode: 'auto',
      cfAccountId: '',
      apiKey: '',
      systemPrompt: '你是一个乐于助人的AI助手。',
      temperature: 0.7,
      autoCollapseReason: true,
      ctxWindow: 64000,
      summaryThreshold: 75,
      model: '',
      savedAt: Date.now()
    };
  }

  function loadConfigIndex() {
    try {
      const raw = localStorage.getItem(CFG_IDX_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  }
  function saveConfigIndex(index) {
    try { localStorage.setItem(CFG_IDX_KEY, JSON.stringify(index)); } catch {}
  }
  function loadConfigs() {
    const index = loadConfigIndex();
    const arr = [];
    for (const item of index) {
      try {
        const raw = localStorage.getItem(CFG_PREFIX + item.id);
        if (!raw) continue;
        arr.push(JSON.parse(raw));
      } catch {}
    }
    return arr;
  }
  function saveConfig(c) {
    c.savedAt = Date.now();
    try { localStorage.setItem(CFG_PREFIX + c.id, JSON.stringify(c)); } catch {}
    let index = loadConfigIndex();
    index = index.filter(x => x.id !== c.id);
    index.unshift({
      id: c.id, name: c.name || '未命名', savedAt: c.savedAt,
      apiBase: c.apiBase || '', model: c.model || ''
    });
    saveConfigIndex(index);
  }
  function deleteConfigLocal(id) {
    localStorage.removeItem(CFG_PREFIX + id);
    let index = loadConfigIndex();
    index = index.filter(x => x.id !== id);
    saveConfigIndex(index);
  }

  function migrateOldConfigCookies() {
    try {
      const oldIds = getCookie('swc_ai_cfg_ids');
      if (!oldIds) return;
      let ids = [];
      try { ids = JSON.parse(oldIds); } catch { ids = []; }
      if (ids.length === 0) { delCookie('swc_ai_cfg_ids'); return; }

      const idx = loadConfigIndex();
      const existing = new Set(idx.map(x => x.id));
      for (const id of ids) {
        if (existing.has(id)) { delCookie(CFG_PREFIX + id); continue; }
        const raw = getCookie(CFG_PREFIX + id);
        if (!raw) continue;
        try {
          const c = JSON.parse(raw);
          if (!c.savedAt) c.savedAt = Date.now();
          if (!c.fallbackModelsUrl) c.fallbackModelsUrl = '';
          if (!c.manualModels) c.manualModels = '';
          if (!c.modelMode) c.modelMode = 'auto';
          if (!c.cfAccountId) c.cfAccountId = '';
          localStorage.setItem(CFG_PREFIX + c.id, JSON.stringify(c));
          idx.push({
            id: c.id, name: c.name || '未命名', savedAt: c.savedAt,
            apiBase: c.apiBase || '', model: c.model || ''
          });
        } catch {}
        delCookie(CFG_PREFIX + id);
      }
      saveConfigIndex(idx);
      delCookie('swc_ai_cfg_ids');
    } catch {}
  }
  migrateOldConfigCookies();

  let configs = loadConfigs();
  let currentConfigId = getCookie(CUR_KEY) || '';
  if (configs.length === 0) {
    const c = defaultConfig('配置 1');
    configs = [c];
    currentConfigId = c.id;
    saveConfig(c);
    setCookie(CUR_KEY, c.id);
  }
  if (!configs.find(c => c.id === currentConfigId)) {
    currentConfigId = configs[0].id;
    setCookie(CUR_KEY, currentConfigId);
  }
  function curConfig() { return configs.find(c => c.id === currentConfigId) || configs[0]; }
  function configById(id) { return configs.find(c => c.id === id); }

  // ═══════════════════════════════════════════════════════
  // 会话存储层
  // ═══════════════════════════════════════════════════════
  const IDX_KEY = 'swc_ai_index';
  const P = 'swc_ai_conv:';

  function upgradeMeta(m) {
    if (!m) return m;
    if (m.schema >= 2) return m;
    return { ...m, schema: 2, savedAt: m.savedAt || m.updatedAt || m.createdAt || Date.now() };
  }
  const S = {
    idx() { try { const r = localStorage.getItem(IDX_KEY); return r ? JSON.parse(r) : []; } catch { return []; } },
    setIdx(v) { localStorage.setItem(IDX_KEY, JSON.stringify(v)); },
    add(id) { const a = this.idx(); if (!a.includes(id)) { a.unshift(id); this.setIdx(a); } },
    rem(id) { this.setIdx(this.idx().filter(x => x !== id)); },
    meta(id) {
      try {
        const r = localStorage.getItem(P + id + ':meta');
        if (!r) return null;
        return upgradeMeta(JSON.parse(r));
      } catch { return null; }
    },
    setMeta(id, m) { m.schema = 2; localStorage.setItem(P + id + ':meta', JSON.stringify(m)); },
    delMeta(id) { localStorage.removeItem(P + id + ':meta'); },
    turn(id, n) { try { const r = localStorage.getItem(P + id + ':turn:' + n); return r ? JSON.parse(r) : null; } catch { return null; } },
    setTurn(id, n, t) { localStorage.setItem(P + id + ':turn:' + n, JSON.stringify(t)); },
    delTurn(id, n) { localStorage.removeItem(P + id + ':turn:' + n); },
    turns(id, c) {
      const a = []; for (let i = 0; i < c; i++) { const t = this.turn(id, i); if (t) a.push(t); } return a;
    },
    delConv(id) {
      const m = this.meta(id); const c = m?.turnCount || 0;
      for (let i = 0; i < c; i++) this.delTurn(id, i);
      this.delMeta(id); this.rem(id);
    },
    metas() { return this.idx().map(id => this.meta(id)).filter(Boolean); },
    rewriteTurns(id, turns) {
      const m = this.meta(id); if (!m) return;
      const old = m.turnCount || 0;
      for (let i = 0; i < Math.max(old, turns.length); i++) this.delTurn(id, i);
      turns.forEach((t, i) => this.setTurn(id, i, t));
      m.turnCount = turns.length;
      m.savedAt = Date.now();
      m.schema = 2;
      this.setMeta(id, m);
    },
    replaceConv(id, meta, turns) {
      const old = this.meta(id);
      if (old && old.turnCount) {
        for (let i = 0; i < old.turnCount; i++) this.delTurn(id, i);
      }
      meta.schema = 2;
      this.setMeta(id, meta);
      (turns || []).forEach((t, i) => this.setTurn(id, i, t));
      this.add(id);
    }
  };

  // ─── 同步状态 ───
  const SYNC_KEY = 'swc_ai_sync_states';
  function loadSyncStates() {
    try { const r = localStorage.getItem(SYNC_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; }
  }
  function saveSyncStates(states) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(states)); } catch {} }
  let syncStates = loadSyncStates();
  function setSyncState(id, state) { syncStates[id] = state; saveSyncStates(syncStates); renderConvList(); }
  function getSyncState(id) { return syncStates[id] || 'unknown'; }
  function delSyncState(id) { delete syncStates[id]; saveSyncStates(syncStates); }

  // ─── 会话状态 ───
  let curId = null, curMeta = null, curTurns = [];
  const runningConvs = new Map();

  function newConv() {
    const c = curConfig();
    const id = uuid();
    const m = {
      schema: 2, id, title: '新对话',
      model: c.model || '', configId: c.id, configName: c.name,
      reasoning: '', createdAt: Date.now(), savedAt: Date.now(),
      turnCount: 0, summary: ''
    };
    S.setMeta(id, m); S.add(id);
    setSyncState(id, 'local-only');
    return m;
  }
  function loadConv(id) {
    const m = S.meta(id); if (!m) return false;
    curId = id; curMeta = m; curTurns = S.turns(id, m.turnCount || 0);
    if (m.configId) {
      const cfg = configById(m.configId);
      if (cfg) {
        if (currentConfigId !== cfg.id) {
          currentConfigId = cfg.id;
          setCookie(CUR_KEY, cfg.id);
          modelsCache = loadModels();
        }
        btnConfig.classList.remove('error');
        btnModel.classList.remove('error');
      } else {
        btnConfig.classList.add('error');
        btnModel.classList.add('error');
      }
    } else {
      btnConfig.classList.add('error');
      btnModel.classList.add('error');
    }
    return true;
  }
  function delConv(id) {
    const run = runningConvs.get(id);
    if (run) {
      if (run.saveTimer) clearInterval(run.saveTimer);
      if (run.ac) try { run.ac.abort(); } catch {}
      runningConvs.delete(id);
    }
    S.delConv(id);
    delSyncState(id);
    if (curId === id) {
      const r = S.idx();
      if (r.length > 0) loadConv(r[0]);
      else { curId = null; curMeta = null; curTurns = []; }
    }
  }
  function touchConv(id) {
    const m = S.meta(id); if (!m) return;
    m.savedAt = Date.now(); m.schema = 2;
    S.setMeta(id, m);
    setSyncState(id, 'local-newer');
  }

  // ─── 上下文 ───
  const CTX = {
    tk(t) {
      if (!t) return 0;
      let b = 0;
      for (let i = 0; i < t.length; i++) {
        const c = t.charCodeAt(i);
        b += c < 0x80 ? 1 : (c < 0x800 ? 2 : 3);
      }
      return Math.ceil(b / 3);
    },
    build(turns, o) {
      o = o || {};
      const sys = o.systemPrompt || '';
      const sum = o.summary || '';
      const win = o.ctxWindow || 64000;
      const thr = o.summaryThreshold || 75;
      const max = Math.floor(win * thr / 100);
      const msgs = [];
      let fixed = 0;
      if (sys) { msgs.push({ role: 'system', content: sys }); fixed += this.tk(sys) + 4; }
      if (sum) { const s = '以下是之前对话的摘要：\n\n' + sum; msgs.push({ role: 'system', content: s }); fixed += this.tk(s) + 4; }
      const recent = []; let run = fixed;
      for (let i = turns.length - 1; i >= 0; i--) {
        const t = turns[i];
        const total = this.tk(t.user.content) + this.tk(t.assistant.content) + 8;
        if (run + total > max && recent.length >= 3) break;
        recent.unshift(t); run += total;
      }
      for (const t of recent) {
        msgs.push({ role: 'user', content: t.user.content });
        if (t.assistant.content) msgs.push({ role: 'assistant', content: t.assistant.content });
      }
      return { messages: msgs, usedTokens: run };
    }
  };

  // ─── 模型缓存 ───
  function modelsCacheKey() { return 'swc_ai_models_' + currentConfigId; }
  function loadModels() {
    try { const r = localStorage.getItem(modelsCacheKey()); return r ? JSON.parse(r) : []; }
    catch { return []; }
  }
  function saveModels(list) { localStorage.setItem(modelsCacheKey(), JSON.stringify(list)); }
  let modelsCache = loadModels();

  // ─── 云 API ───
  async function cloudApi(opts) {
    const token = getToken();
    if (!token) return { error: 'unauthorized' };
    let url = '/api/ai-conv';
    const params = [];
    if (opts.type) params.push('type=' + encodeURIComponent(opts.type));
    if (opts.id) params.push('id=' + encodeURIComponent(opts.id));
    if (opts.meta) params.push('meta=1');
    if (params.length) url += '?' + params.join('&');
    const fetchOpts = { method: opts.method || 'GET', headers: { 'Authorization': 'Bearer ' + token } };
    if (opts.body) {
      fetchOpts.headers['Content-Type'] = 'application/json';
      fetchOpts.body = JSON.stringify(opts.body);
    }
    try {
      const res = await fetch(url, fetchOpts);
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch {}
      if (!res.ok) return { error: 'http-' + res.status, body: text.slice(0, 500) };
      return data;
    } catch (e) {
      return { error: 'network', detail: e.message };
    }
  }

  // ═══════════════════════════════════════════════════════
  // 同步
  // ═══════════════════════════════════════════════════════
  let syncing = false;

  function updateProgress(elId, text) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (text) { el.textContent = text; el.classList.add('show'); }
    else { el.textContent = ''; el.classList.remove('show'); }
  }

  async function uploadConv(id) {
    const m = S.meta(id); if (!m) return false;
    const turns = S.turns(id, m.turnCount || 0);
    const r = await cloudApi({ method: 'PUT', body: { id, conversation: { ...m, turns } } });
    return !r.error;
  }
  async function downloadConv(id) {

  async function syncAll(silent) {

      if (!silent) showDiag('未登录', ['请先在主站登录。']);
      return { error: 'unauthorized' };
    }
    syncing = true;
    let uploaded = 0, downloaded = 0, skipped = 0, failed = 0;
    try {
      if (!silent) updateProgress('cloudProgress', '正在读取云端索引...');
      const cloudData = await cloudApi({});
      if (cloudData.error) {
        if (!silent) showDiag('同步失败：拉取索引', [
          { k: '错误', v: cloudData.error },
          { k: '详情', v: cloudData.body || cloudData.detail || '' }
        ]);
        return { error: cloudData.error };
      }
      const cloudIndex = Array.isArray(cloudData.index) ? cloudData.index : [];
      const cloudMap = new Map(cloudIndex.map(x => [x.id, x]));
      const localIds = S.idx();
      const localMap = new Map();
      for (const id of localIds) {
        const m = S.meta(id);
        if (m) localMap.set(id, m);
      }
      const toUpload = [];
      const toDownload = [];
      for (const [id, lm] of localMap) {
        const cm = cloudMap.get(id);
        if (!cm) { toUpload.push(id); continue; }
        const lt = lm.savedAt || 0;
        const ct = cm.savedAt || 0;
        if (lt > ct) toUpload.push(id);
        else if (ct > lt) toDownload.push(id);
        else { skipped++; setSyncState(id, 'synced'); }
      }
      for (const [id] of cloudMap) if (!localMap.has(id)) toDownload.push(id);
      const total = toUpload.length + toDownload.length;
      for (let i = 0; i < toUpload.length; i++) {
        const id = toUpload[i];
        if (!silent) updateProgress('cloudProgress', `上传中 ${i+1}/${total}...`);
        if (runningConvs.has(id)) { skipped++; continue; }
        const ok = await uploadConv(id);
        if (ok) { uploaded++; setSyncState(id, 'synced'); }
        else { failed++; setSyncState(id, 'failed'); }
      }
      for (let i = 0; i < toDownload.length; i++) {
        const id = toDownload[i];
        if (!silent) updateProgress('cloudProgress', `下载中 ${i+1}/${total}...`);
        if (runningConvs.has(id)) { skipped++; continue; }
        const ok = await downloadConv(id);
        if (ok) { downloaded++; setSyncState(id, 'synced'); }
        else { failed++; setSyncState(id, 'failed'); }
      }
      if (!silent) {
        updateProgress('cloudProgress', '');
        alert(`同步完成\n上传 ${uploaded} 个，下载 ${downloaded} 个，跳过 ${skipped} 个，失败 ${failed} 个`);
      }
      if (downloaded > 0) {
        if (!curId && S.idx().length > 0) loadConv(S.idx()[0]);
        renderChat();
      } else renderConvList();
      return { uploaded, downloaded, skipped, failed };
    } finally {
      syncing = false;
    }
  }

  // ─── 消息操作 ───
  function copyText(text) {
    if (!text) { showToast('无内容'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast('已复制')).catch(() => fallbackCopy(text));
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制');
    } catch { showToast('复制失败'); }
  }
  function toggleMark(idx) {
    if (idx < 0 || idx >= curTurns.length) return;
    curTurns[idx].marked = !curTurns[idx].marked;

    if (!curId) return;

    if (idx < 0 || idx >= curTurns.length) return;
    const turn = curTurns[idx];

    const userContent = turn.user.content;
    if (!userContent) return;
    curTurns = curTurns.slice(0, idx);

    renderChat();
    inputEl.value = userContent;
    await send();

    frag.appendChild(u);

    const a = document.createElement('div');
    a.className = 'msg ai' + (marked ? ' marked' : '');
    a.innerHTML =
      '<div class="ava">AI</div>' +
      '<div class="wrap">' +
        '<div class="bubble"></div>' +
        '<div class="msg-actions">' +
          '<button data-act="copy" type="button">复制</button>' +
          '<button data-act="resend" type="button">重发</button>' +
          '<button data-act="delete" type="button">删除</button>' +
          '<button data-act="mark" type="button">' + (marked ? '★ 已标记' : '标记') + '</button>' +
        '</div>' +
      '</div>';
    const wrap = a.querySelector('.wrap');
    const bubble = a.querySelector('.bubble');

    if (turn.assistant.reasoning_content) {
      const d = document.createElement('details');
      d.className = 'reason';
      d.innerHTML = '<summary>推理过程</summary><div class="rc"></div>';
      d.querySelector('.rc').textContent = turn.assistant.reasoning_content;
      wrap.insertBefore(d, bubble);
    }
    bubble.innerHTML = turn.assistant.content ? md(turn.assistant.content) : '';

    a.querySelector('[data-act="copy"]').addEventListener('click', (e) => { e.stopPropagation(); copyText(turn.assistant.content || ''); });
    a.querySelector('[data-act="resend"]').addEventListener('click', (e) => { e.stopPropagation(); resendTurn(turnIdx); });
    a.querySelector('[data-act="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteTurn(turnIdx); });
    a.querySelector('[data-act="mark"]').addEventListener('click', (e) => { e.stopPropagation(); toggleMark(turnIdx); });

    frag.appendChild(a);
    return frag;
  }

  function bindDomRefs(convId) {
    const run = runningConvs.get(convId);
    if (!run) return;
    const msgs = chatEl.querySelectorAll('.msg.ai');
    const target = msgs[run.turnIdx];
    if (!target) { run.domRef = null; return; }
    const ref = {
      wrap: target.querySelector('.wrap'),
      bubble: target.querySelector('.bubble'),
      reasonEl: target.querySelector('.reason'),
      reasonContentEl: target.querySelector('.reason .rc')
    };
    if (ref.reasonEl && !run.autoCollapsed) ref.reasonEl.open = true;
    run.domRef = ref;
    const curTurn = run.turn;
    if (curTurn) {
      if (curTurn.assistant.reasoning_content) {
        if (!ref.reasonEl) {
          ref.reasonEl = document.createElement('details');
          ref.reasonEl.className = 'reason';
          ref.reasonEl.open = true;
          ref.reasonEl.innerHTML = '<summary>推理过程</summary><div class="rc"></div>';
          ref.reasonContentEl = ref.reasonEl.querySelector('.rc');
          ref.wrap.insertBefore(ref.reasonEl, ref.bubble);
        }
        ref.reasonContentEl.textContent = curTurn.assistant.reasoning_content;
        if (!run.autoCollapsed) ref.reasonEl.open = true;
        else ref.reasonEl.open = false;
      }
      if (curTurn.assistant.content) {
        ref.bubble.innerHTML = md(curTurn.assistant.content);
      }
    }
  }

    };

    convListEl.innerHTML = '';
    S.metas().forEach(m => {
      const isGen = runningConvs.has(m.id);
      const it = document.createElement('div');
      it.className = 'sb-item' + (m.id === curId ? ' active' : '');
      const syncState = getSyncState(m.id);

      if (isGen) leftPart = '<span class="spin" title="生成中"></span>';

        '<input class="rn" type="text">';
      const rn = it.querySelector('.rn');
      rn.value = m.title || '新对话';
      it.querySelector('.d').addEventListener('click', (e) => {
        e.stopPropagation();
        openConvMenu(e.currentTarget, m.id);
      });
      it.querySelector('.t').addEventListener('dblclick', (e) => {
        e.stopPropagation();
        it.classList.add('renaming');
        rn.focus(); rn.select();
      });
      const commitRename = () => {
        const v = rn.value.trim();
        if (v && v !== m.title) {
          m.title = v;
          m.savedAt = Date.now();
          m.schema = 2;
          S.setMeta(m.id, m);
          setSyncState(m.id, 'local-newer');
          if (m.id === curId) { curMeta = m; convTitleEl.textContent = m.title; }
        }
        it.classList.remove('renaming');
        renderConvList();
      };
      rn.addEventListener('blur', commitRename);
      rn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); rn.blur(); }
        else if (e.key === 'Escape') { rn.value = m.title; rn.blur(); }
      });
      rn.addEventListener('click', e => e.stopPropagation());
      it.addEventListener('click', () => {
        if (it.classList.contains('renaming')) return;
        loadConv(m.id);
        renderChat();
        if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) closeSidebar();
      });
      convListEl.appendChild(it);
    });
  }

    const a = document.createElement('a');
    a.href = url;
    a.download = 'swc-ai-all-' + Date.now() + '.json';

  // ─── 获取模型 ───
  let fetchingModels = false;

  async function fetchModels(silent) {
    if (fetchingModels) return;
    const c = curConfig();
    if (!c.proxyUrl || !c.proxyPassword) {
      if (!silent) showDiag('代理配置不完整', [
        { k: '配置名', v: c.name },
        { k: '代理地址', v: c.proxyUrl || '(空)' },
        { k: '代理密码', v: c.proxyPassword ? '已填' : '(空)' }
      ]);
      return;
    }

    // ─── 模式 1：手动列表 ───
    if (c.modelMode === 'manual' && c.manualModels) {
      const list = c.manualModels.split('\n').map(s => s.trim()).filter(Boolean);
      if (list.length > 0) {
        modelsCache = list;
        saveModels(list);
        renderModelList();
        if (!curMeta?.model && !c.model) selectModel(list[0]);
        return;
      }
    }

    // ─── 模式 2：Cloudflare Workers AI ───
    if (c.modelMode === 'cloudflare') {
      if (!c.cfAccountId || !c.apiKey) {
        if (!silent) showDiag('Cloudflare 配置不完整', [
          { k: '配置名', v: c.name },
          { k: 'Account ID', v: c.cfAccountId || '(空)' },
          { k: 'API Key', v: c.apiKey ? '已填' : '(空)' }
        ]);
        return;
      }
      fetchingModels = true;
      const btn = document.getElementById('btnRefreshModels');
      btn.disabled = true; btn.textContent = '…';
      const cfUrl = 'https://api.cloudflare.com/client/v4/accounts/' + encodeURIComponent(c.cfAccountId) + '/ai/models/search';
      try {
        const res = await fetch(c.proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: c.proxyPassword,
            target: cfUrl,
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + c.apiKey }
          })
        });
        const bodyText = await res.text();
        if (!res.ok) {
          if (!silent) showDiag('Cloudflare 获取模型失败 HTTP ' + res.status, [
            { k: '目标', v: cfUrl },
            { k: '状态', v: res.status },
            { k: '响应体', v: bodyText.slice(0, 2000) }
          ]);
          return;
        }
        let data;
        try { data = JSON.parse(bodyText); }
        catch {
          if (!silent) showDiag('响应不是 JSON', [
            { k: '目标', v: cfUrl },
            { k: '响应体', v: bodyText.slice(0, 2000) }
          ]);
          return;
        }
        let list = [];
        if (data.result && Array.isArray(data.result)) {
          list = data.result.map(m => m.name || m.id).filter(Boolean);
        } else if (Array.isArray(data)) {
          list = data.map(m => m.name || m.id).filter(Boolean);
        }
        if (list.length === 0) {
          if (!silent) showDiag('未解析到 Cloudflare 模型', [
            { k: '目标', v: cfUrl },
            { k: '响应体', v: bodyText.slice(0, 2000) }
          ]);
          return;
        }
        modelsCache = list;
        saveModels(list);
        renderModelList();
        if (!curMeta?.model && !c.model) selectModel(list[0]);
      } catch (e) {
        if (!silent) showDiag('Cloudflare 获取模型网络异常', [
          { k: '代理地址', v: c.proxyUrl },
          { k: '异常', v: e.name + ': ' + e.message }
        ]);
      } finally {
        fetchingModels = false;
        btn.disabled = false; btn.textContent = '↻';
      }
      return;
    }

    // ─── 模式 3：自动（主 API /models → 备用列表）───
    if (!c.apiKey) {
      if (!silent) showDiag('API Key 未填写', [
        { k: '配置名', v: c.name },
        { k: '提示', v: '自动模式下需要填写 API Key' }
      ]);
      return;
    }

    const targets = [];
    if (c.apiBase) {
      targets.push({
        label: '主 API',
        url: c.apiBase.replace(/\/+$/, '') + '/models'
      });
    }
    if (c.fallbackModelsUrl) {
      const u = (c.fallbackModelsUrl || '').trim();
      if (u) targets.push({ label: '备用模型列表', url: u });
    }

    if (targets.length === 0) {
      if (!silent) showDiag('未配置 API 地址', [
        { k: '配置名', v: c.name },
        '请在配置里填写「API 地址」或「备用模型列表地址」。'
      ]);
      return;
    }

    fetchingModels = true;
    const btn = document.getElementById('btnRefreshModels');
    btn.disabled = true; btn.textContent = '…';

    const attemptLog = [];
    let list = null;
    let successTarget = null;

    for (const t of targets) {
      try {
        const res = await fetch(c.proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: c.proxyPassword,
            target: t.url,
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + c.apiKey }
          })
        });
        const bodyText = await res.text();

        if (!res.ok) {
          attemptLog.push({
            k: t.label + ' [' + t.url + ']',
            v: 'HTTP ' + res.status + ' ' + (res.statusText || '') + ' | ' + bodyText.slice(0, 200)
          });
          continue;
        }

        let data;
        try { data = JSON.parse(bodyText); }
        catch {
          attemptLog.push({
            k: t.label + ' [' + t.url + ']',
            v: '响应不是 JSON | ' + bodyText.slice(0, 200)
          });
          continue;
        }

        let arr = [];
        if (Array.isArray(data.data)) arr = data.data.map(m => m.id || m.name).filter(Boolean);
        else if (Array.isArray(data.models)) arr = data.models.map(m => m.id || m.name).filter(Boolean);
        else if (Array.isArray(data)) arr = data.map(m => (typeof m === 'string' ? m : (m.id || m.name))).filter(Boolean);

        if (arr.length === 0) {
          attemptLog.push({
            k: t.label + ' [' + t.url + ']',
            v: '未解析到模型列表 | ' + bodyText.slice(0, 200)
          });
          continue;
        }

        list = arr;
        successTarget = t;
        break;
      } catch (e) {
        attemptLog.push({
          k: t.label + ' [' + t.url + ']',
          v: '网络异常: ' + e.name + ': ' + e.message
        });
        continue;
      }
    }

    btn.disabled = false; btn.textContent = '↻';
    fetchingModels = false;

    if (!list) {
      if (!silent) {
        showDiag('获取模型失败：所有地址都不可用', [
          { k: '配置', v: c.name },
          { k: '尝试次数', v: targets.length },
          '',
          ...attemptLog
        ]);
      }
      return;
    }

    modelsCache = list;
    saveModels(list);
    renderModelList();
    if (!curMeta?.model && !c.model) selectModel(list[0]);

    if (successTarget.label !== '主 API') {
      showToast('已通过「' + successTarget.label + '」获取模型');
    }
  }

  // ─── 发送 ───
  async function send() {
    if (curId && runningConvs.has(curId)) {
      const run = runningConvs.get(curId);
      if (run.ac) try { run.ac.abort(); } catch {}
      return;
    }
    const text = inputEl.value.trim();
    if (!text) return;

    if (curMeta && curMeta.configId && !configById(curMeta.configId)) {
      alert('此对话的 API 配置已被删除，请重新选择配置。');
      btnConfig.click();
      return;
    }

    const c = curConfig();
    if (!c.proxyUrl || !c.proxyPassword || !c.apiBase || !c.apiKey) {
      showDiag('配置不完整', [
        { k: '配置名', v: c.name },
        { k: '代理地址', v: c.proxyUrl || '(空)' },
        { k: '代理密码', v: c.proxyPassword ? '已填' : '(空)' },
        { k: 'API 地址', v: c.apiBase || '(空)' },
        { k: 'API Key', v: c.apiKey ? '已填' : '(空)' }
      ]);
      openConfigEdit(c);
      return;
    }

    const model = curMeta?.model || c.model;
    if (!model) {
      showDiag('未选择模型', ['点击顶栏「模型」选择或手动输入。']);
      btnModel.click();
      return;
    }

    if (!curId) {
      const m = newConv();
      curId = m.id; curMeta = m; curTurns = [];
    }

    const convId = curId;
    const ti = curTurns.length;
    const turn = { user: { content: text }, assistant: { content: '', reasoning_content: '' }, ts: Date.now(), marked: false };
    curTurns.push(turn);

    if (curMeta.turnCount === 0) {
      const t = text.replace(/\s+/g, ' ').trim();
      curMeta.title = t.length > 20 ? t.slice(0, 20) + '…' : (t || '新对话');
    }
    curMeta.turnCount = curTurns.length;
    curMeta.savedAt = Date.now();
    curMeta.schema = 2;
    S.setMeta(convId, curMeta);
    S.setTurn(convId, ti, turn);

    inputEl.value = '';
    inputEl.style.height = 'auto';
    if (welcomeEl.parentNode) welcomeEl.remove();

    const u = document.createElement('div');
    u.className = 'msg user';
    u.innerHTML = '<div class="ava">你</div><div class="wrap"><div class="bubble"></div><div class="msg-actions"><button data-act="copy">复制</button><button data-act="delete">删除</button><button data-act="mark">标记</button></div></div>';
    u.querySelector('.bubble').textContent = text;
    u.querySelector('[data-act="copy"]').addEventListener('click', (e) => { e.stopPropagation(); copyText(text); });
    u.querySelector('[data-act="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteTurn(ti); });
    u.querySelector('[data-act="mark"]').addEventListener('click', (e) => { e.stopPropagation(); toggleMark(ti); });
    chatEl.appendChild(u);

    const a = document.createElement('div');
    a.className = 'msg ai';
    a.innerHTML = '<div class="ava">AI</div><div class="wrap"><div class="bubble"></div><div class="msg-actions"><button data-act="copy">复制</button><button data-act="resend">重发</button><button data-act="delete">删除</button><button data-act="mark">标记</button></div></div>';
    const wrap = a.querySelector('.wrap');
    const bubble = a.querySelector('.bubble');
    a.querySelector('[data-act="copy"]').addEventListener('click', (e) => { e.stopPropagation(); copyText(turn.assistant.content || ''); });
    a.querySelector('[data-act="resend"]').addEventListener('click', (e) => { e.stopPropagation(); resendTurn(ti); });
    a.querySelector('[data-act="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteTurn(ti); });
    a.querySelector('[data-act="mark"]').addEventListener('click', (e) => { e.stopPropagation(); toggleMark(ti); });
    chatEl.appendChild(a);

    convTitleEl.textContent = curMeta.title;
    renderConvList();
    isAtBottom = true;
    chatEl.scrollTop = chatEl.scrollHeight;

    const ctx = CTX.build(curTurns.slice(0, -1), {
      systemPrompt: c.systemPrompt,
      summary: curMeta.summary || '',
      ctxWindow: c.ctxWindow || 64000,
      summaryThreshold: c.summaryThreshold || 75
    });
    ctx.messages.push({ role: 'user', content: text });

    const body = { model, messages: ctx.messages, stream: true };
    const t = parseFloat(c.temperature);
    if (!isNaN(t)) body.temperature = t;
    if (curMeta.reasoning) body.reasoning_effort = curMeta.reasoning;

    const ac = new AbortController();
    const run = {
      ac, turnIdx: ti, turn,
      domRef: { wrap, bubble, reasonEl: null, reasonContentEl: null },
      autoCollapsed: false, saveTimer: null
    };
    runningConvs.set(convId, run);
    updateSendButton();
    renderConvList();

    run.saveTimer = setInterval(() => {
      const m = S.meta(convId);
      if (m) { m.savedAt = Date.now(); S.setMeta(convId, m); }
      S.setTurn(convId, ti, turn);
    }, 2000);

    function updateStreamingUI() {
      const r = run.domRef;
      if (!r || !r.wrap || !document.contains(r.wrap)) return;
      if (turn.assistant.reasoning_content) {
        if (!r.reasonEl) {
          r.reasonEl = document.createElement('details');
          r.reasonEl.className = 'reason';
          r.reasonEl.open = true;
          r.reasonEl.innerHTML = '<summary>推理过程</summary><div class="rc"></div>';
          r.reasonContentEl = r.reasonEl.querySelector('.rc');
          r.wrap.insertBefore(r.reasonEl, r.bubble);
        }
        r.reasonContentEl.textContent = turn.assistant.reasoning_content;
        if (!run.autoCollapsed) r.reasonEl.open = true;
      }
      if (turn.assistant.content) {
        if (r.reasonEl && c.autoCollapseReason !== false && !run.autoCollapsed) {
          r.reasonEl.open = false;
          run.autoCollapsed = true;
        }
        r.bubble.innerHTML = md(turn.assistant.content);
      }
      autoScroll();
    }

    try {
      const res = await fetch(c.proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: c.proxyPassword,
          target: c.apiBase.replace(/\/+$/, '') + '/chat/completions',
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + c.apiKey,
            'Content-Type': 'application/json'
          },
          body
        }),
        signal: ac.signal
      });

      if (!res.ok) {
        const t2 = await res.text();
        showDiag('对话失败 HTTP ' + res.status, [
          { k: '配置', v: c.name },
          { k: '目标', v: c.apiBase + '/chat/completions' },
          { k: '状态', v: res.status + ' ' + res.statusText },
          { k: '响应体', v: t2.slice(0, 3000) }
        ]);
        throw new Error('HTTP ' + res.status);
      }

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const raw of lines) {
          const line = raw.trim();
          if (!line.startsWith('data:')) continue;
          const p = line.slice(5).trim();
          if (!p || p === '[DONE]') continue;
          try {
            const j = JSON.parse(p);
            const d = j.choices?.[0]?.delta || j.choices?.[0]?.message || {};
            if (typeof d.reasoning_content === 'string' && d.reasoning_content) {
              turn.assistant.reasoning_content += d.reasoning_content;
              updateStreamingUI();
            }
            if (typeof d.thinking === 'string' && d.thinking) {
              turn.assistant.reasoning_content = (turn.assistant.reasoning_content || '') + d.thinking;
              updateStreamingUI();
            }
            if (typeof d.content === 'string' && d.content) {
              turn.assistant.content += d.content;
              updateStreamingUI();
            }
          } catch {}
        }
      }

      if (!turn.assistant.content && !turn.assistant.reasoning_content) {
        turn.assistant.content = '（无内容返回）';
        updateStreamingUI();
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        if (!turn.assistant.content && !turn.assistant.reasoning_content) {
          turn.assistant.content = '（已停止）';
          updateStreamingUI();
        }
      } else {
        if (!turn.assistant.content) {
          turn.assistant.content = '⚠ ' + err.message;
          updateStreamingUI();
        }
      }
    } finally {
      if (run.saveTimer) clearInterval(run.saveTimer);
      S.setTurn(convId, ti, turn);
      const m = S.meta(convId);
      if (m) { m.savedAt = Date.now(); S.setMeta(convId, m); }
      runningConvs.delete(convId);
      setSyncState(convId, 'local-newer');
      updateSendButton();
      renderConvList();
    }
  }

  // ─── 编辑配置 ───
  let editingConfigId = null;
  function openConfigEdit(cfg) {
    editingConfigId = cfg ? cfg.id : null;
    const c = cfg || defaultConfig('配置 ' + (configs.length + 1));
    document.getElementById('configEditTitle').textContent = cfg ? '编辑配置' : '新建配置';
    document.getElementById('ceName').value = c.name || '';
    document.getElementById('ceProxyUrl').value = c.proxyUrl || '/api/aiapi';
    document.getElementById('ceProxyPassword').value = c.proxyPassword || '';
    document.getElementById('ceApiBase').value = c.apiBase || '';
    document.getElementById('ceFallbackModelsUrl').value = c.fallbackModelsUrl || '';
    document.getElementById('ceManualModels').value = c.manualModels || '';
    document.getElementById('ceModelMode').value = c.modelMode || 'auto';
    document.getElementById('ceCfAccountId').value = c.cfAccountId || '';
    document.getElementById('ceApiKey').value = c.apiKey || '';
    document.getElementById('ceSystem').value = c.systemPrompt || '';
    document.getElementById('ceTemperature').value = c.temperature ?? '';
    document.getElementById('ceAutoCollapse').checked = c.autoCollapseReason !== false;
    document.getElementById('ceCtxWindow').value = c.ctxWindow ?? 64000;
    document.getElementById('ceSummaryThreshold').value = c.summaryThreshold ?? 75;
    document.getElementById('ceDelete').style.display = cfg ? 'inline-block' : 'none';
    document.getElementById('configEditModal').classList.add('show');
  }
  function closeConfigEdit() {
    document.getElementById('configEditModal').classList.remove('show');
    editingConfigId = null;
  }
  document.getElementById('ceCancel').addEventListener('click', closeConfigEdit);
  document.getElementById('ceDelete').addEventListener('click', async () => {
    if (!editingConfigId) return;
    const id = editingConfigId;
    closeConfigEdit();
    await strictDeleteConfig(id);
  });
  document.getElementById('ceSave').addEventListener('click', () => {
    const name = document.getElementById('ceName').value.trim() || '未命名配置';
    const newCfg = {
      id: editingConfigId || uuid(),
      name,
      proxyUrl: document.getElementById('ceProxyUrl').value.trim() || '/api/aiapi',
      proxyPassword: document.getElementById('ceProxyPassword').value,
      apiBase: document.getElementById('ceApiBase').value.trim(),
      fallbackModelsUrl: document.getElementById('ceFallbackModelsUrl').value.trim(),
      manualModels: document.getElementById('ceManualModels').value.trim(),
      modelMode: document.getElementById('ceModelMode').value || 'auto',
      cfAccountId: document.getElementById('ceCfAccountId').value.trim(),
      apiKey: document.getElementById('ceApiKey').value,
      systemPrompt: document.getElementById('ceSystem').value,
      temperature: parseFloat(document.getElementById('ceTemperature').value) || 0.7,
      autoCollapseReason: document.getElementById('ceAutoCollapse').checked,
      ctxWindow: parseInt(document.getElementById('ceCtxWindow').value) || 64000,
      summaryThreshold: parseInt(document.getElementById('ceSummaryThreshold').value) || 75,
      model: '',
      savedAt: Date.now()
    };
    if (editingConfigId) {
      const idx = configs.findIndex(c => c.id === editingConfigId);
      if (idx >= 0) {
        newCfg.model = configs[idx].model || '';
        configs[idx] = newCfg;
      }
    } else {
      configs.push(newCfg);
      currentConfigId = newCfg.id;
      setCookie(CUR_KEY, newCfg.id);
    }
    saveConfig(newCfg);
    setSyncState(newCfg.id, 'local-newer');
    closeConfigEdit();
    updateConfigLabel();
    updateModelLabel();
    renderConfigManagerList();
  });

  // ─── 云同步面板 ───
  async function renderCloudList() {
    cloudList.innerHTML = '<div class="popup-empty">加载中…</div>';
    const data = await cloudApi({});
    if (data.error) {
      cloudList.innerHTML = '<div class="popup-empty">加载失败：' + esc(data.error) + '</div>';
      return;
    }
    const index = Array.isArray(data.index) ? data.index : [];
    const localIds = S.idx();
    const allIds = new Set([...localIds, ...index.map(x => x.id)]);
    if (allIds.size === 0) {
      cloudList.innerHTML = '<div class="popup-empty">暂无对话</div>';
      return;
    }
    const cloudMap = new Map(index.map(x => [x.id, x]));
    const localMap = new Map();
    for (const id of localIds) {
      const m = S.meta(id);
      if (m) localMap.set(id, m);
    }
    const merged = [];
    for (const id of allIds) {
      const lm = localMap.get(id);
      const cm = cloudMap.get(id);
      const savedAt = Math.max(lm?.savedAt || 0, cm?.savedAt || 0);
      merged.push({ id, lm, cm, savedAt });
    }
    merged.sort((a, b) => b.savedAt - a.savedAt);
    cloudList.innerHTML = '';
    merged.forEach(({ id, lm, cm }) => {
      const isGen = runningConvs.has(id);
      const state = getSyncState(id);
      let title = '未命名', turnCount = 0, time = 0;
      if (lm) { title = lm.title; turnCount = lm.turnCount || 0; time = lm.savedAt; }
      else if (cm) { title = cm.title; turnCount = cm.turnCount || 0; time = cm.savedAt; }
      const row = document.createElement('div');
      row.className = 'cloud-row';
      const leftIcon = isGen
        ? '<span class="spin" title="生成中"></span>'
        : '<span class="sync-icon" data-state="' + state + '" title="' + state + '">' + stateIcon(state) + '</span>';
      row.innerHTML = leftIcon +
        '<div class="info"><div class="t">' + esc(title) + '</div>' +
        '<div class="m">' + turnCount + ' 轮 · ' + fmtTime(time) + '</div></div>';
      if (lm && !isGen) {
        const up = document.createElement('button');
        up.textContent = '上传';
        up.addEventListener('click', async () => {
          const ok = await forceUpload(id);
          if (ok) { renderCloudList(); renderConvList(); }
          else alert('上传失败');
        });
        row.appendChild(up);
      }
      if (cm && !isGen) {
        const down = document.createElement('button');
        down.textContent = '下载';
        down.addEventListener('click', async () => {
          const ok = await forceDownload(id);
          if (ok) { renderCloudList(); renderConvList(); }
          else alert('下载失败');
        });
        row.appendChild(down);
      }
      cloudList.appendChild(row);
    });
  }
  document.getElementById('btnCloud').addEventListener('click', (e) => {
    e.stopPropagation();
    if (cloudPopup.classList.contains('show')) { closeAllPopups(); return; }
    cloudPopup.classList.add('show');
    popupMask.classList.add('show');
    cloudPopup.style.top = '50px';
    cloudPopup.style.right = '16px';
    cloudPopup.style.left = 'auto';
    renderCloudList();
  });
  cloudPopup.addEventListener('click', e => e.stopPropagation());
  document.getElementById('btnCloudRefresh').addEventListener('click', renderCloudList);
  document.getElementById('btnSyncAll').addEventListener('click', async () => { await syncAll(false); renderCloudList(); });
  document.getElementById('btnCheckState').addEventListener('click', async () => { await checkState(); renderCloudList(); });

  // ─── 侧边栏 ───
  function openSidebar() { sidebarEl.classList.add('open'); sidebarMask.classList.add('show'); }
  function closeSidebar() { sidebarEl.classList.remove('open'); sidebarMask.classList.remove('show'); }
  btnMenu.addEventListener('click', openSidebar);
  sidebarMask.addEventListener('click', closeSidebar);

  document.getElementById('btnNewConv').addEventListener('click', () => {
    curId = null; curMeta = null; curTurns = [];
    btnConfig.classList.remove('error');
    btnModel.classList.remove('error');
    renderChat();
    if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) closeSidebar();
    inputEl.focus();
  });

  document.getElementById('btnDlAll').addEventListener('click', downloadAll);

  btnSend.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // ─── 启动 ───
  (function init() {
    const ids = S.idx();
    if (ids.length > 0) loadConv(ids[0]);
    renderChat();
    updateConfigLabel();
  })();

})();
</script>
