<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SwCTools · 音乐文件存在性测试</title>
  <style>
    :root {
      --bg-body: #e8edf2;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: #bdd1e6;
      --title-color: #1e4b6e;
      --badge-bg: #d0e2f0;
      --badge-color: #2c6182;
      --text-color: #173e58;
      --corner-text-color: #3a6a8e;
      --fps-bg: rgba(255, 255, 255, 0.6);
      --tool-btn-bg: #cddef0;
      --tool-btn-border: #a3bed8;
      --tool-btn-color: #1a4765;
      --cat-btn-hover-bg: #c2d8ed;
      --go-btn-bg: #4f7f9e;
      --go-btn-hover-bg: #3a6b8c;
    }
    [data-theme="dark"] {
      --bg-body: #0a0f14;
      --panel-bg: rgba(13, 27, 42, 0.9);
      --panel-border: #1e3a5a;
      --title-color: #a0c4e8;
      --badge-bg: #1a3a5c;
      --badge-color: #b0d0f0;
      --text-color: #c0d8f0;
      --corner-text-color: #7a9ab0;
      --fps-bg: rgba(0, 0, 0, 0.5);
      --tool-btn-bg: #1e3a5a;
      --tool-btn-border: #2a5a8a;
      --tool-btn-color: #c0d8f0;
      --cat-btn-hover-bg: #2a5a8a;
      --go-btn-bg: #2a6a9e;
      --go-btn-hover-bg: #1a4a7a;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
    body {
      background:var(--bg-body);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:12px;
      position:relative;
      flex-direction: column;
    }
    .corner-tl, .corner-tr, .corner-br {
      position:fixed; font-size:0.75rem; color:var(--corner-text-color);
      opacity:0.8; z-index:3000; pointer-events:none;
    }
    .corner-tl { top:12px; left:16px; }
    .corner-tr {
      top:12px; right:20px;
      background:var(--fps-bg); padding:4px 12px; border-radius:24px;
      border:1px solid var(--panel-border);
    }
    .corner-br { bottom:12px; right:20px; }
    .theme-toggle {
      position:fixed; bottom:12px; left:16px; font-size:0.9rem;
      background:var(--tool-btn-bg); border:1px solid var(--panel-border);
      color:var(--corner-text-color); padding:5px 14px; border-radius:32px;
      cursor:pointer; opacity:0.85; transition:0.2s; z-index:3000; font-weight:500;
    }
    .theme-toggle:hover { opacity:1; background:var(--cat-btn-hover-bg); }
    .back-btn {
      position:fixed; top:12px; left:16px;
      background:var(--tool-btn-bg); border:1px solid var(--panel-border);
      color:var(--corner-text-color); padding:5px 14px; border-radius:32px;
      text-decoration:none; font-size:0.9rem; z-index:3000; opacity:0.85;
      font-weight:500; transition:0.2s;
    }
    .back-btn:hover { opacity:1; background:var(--cat-btn-hover-bg); }

    .main-panel {
      max-width:720px; width:100%; background:var(--panel-bg);
      border-radius:28px; box-shadow:0 16px 30px -8px rgba(30,65,90,0.18);
      border:1px solid var(--panel-border); padding:30px 28px;
      display:flex; flex-direction:column; gap:20px;
      margin-top: 40px;
    }
    .title-section {
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid var(--panel-border); padding-bottom:12px;
    }
    .title-section h1 { font-size:1.6rem; font-weight:550; color:var(--title-color); }
    .badge {
      font-size:0.9rem; color:var(--badge-color); background:var(--badge-bg);
      padding:4px 12px; border-radius:24px; border:1px solid var(--tool-btn-border);
    }
    .controls {
      display:flex; gap:12px; flex-wrap:wrap;
    }
    .ctrl-btn {
      background:var(--tool-btn-bg); border:1px solid var(--tool-btn-border);
      color:var(--tool-btn-color); padding:8px 20px; border-radius:24px;
      font-size:0.9rem; font-weight:550; cursor:pointer; transition:0.15s;
    }
    .ctrl-btn:hover { background:var(--cat-btn-hover-bg); }
    .ctrl-btn.primary { background:var(--go-btn-bg); color:white; border:none; }
    .ctrl-btn.primary:hover { background:var(--go-btn-hover-bg); }

    .results {
      max-height:65vh; overflow-y:auto; border-top:1px solid var(--panel-border);
      padding-top:8px;
    }
    .result-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px; margin-bottom:6px; border-radius:12px;
      font-size:0.9rem; background:var(--tool-btn-bg);
      border:1px solid var(--tool-btn-border); color:var(--text-color);
    }
    .result-item.ok { border-left:4px solid #2e7d32; }
    .result-item.fail { border-left:4px solid #c62828; }
    .status { font-weight:bold; margin-left:12px; white-space:nowrap; }
    .status.ok { color:#2e7d32; }
    .status.fail { color:#c62828; }

    .progress {
      text-align:center; padding:10px; color:var(--text-color);
    }
  </style>
</head>
<body>

  <div class="corner-tl">不自由毋宁死 · Give me liberty or give me death</div>
  <div class="corner-tr" id="fpsDisplay">FPS: --</div>
  <div class="corner-br">made by ZZC-jeizuchin, github</div>

  <button class="theme-toggle" id="themeToggle">深色</button>
  <a class="back-btn" href="/index.html">← 返回主站</a>

  <div class="main-panel">
    <div class="title-section">
      <h1>🔍 文件存在性测试</h1>
      <span class="badge">music.list</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn primary" id="btnStart">▶ 开始检测</button>
      <button class="ctrl-btn" id="btnStop">⏹ 停止</button>
    </div>

    <div class="progress" id="progress">就绪</div>
    <div class="results" id="results"></div>
  </div>

  <script>
    (function() {
      // ========== 主站通用功能 ==========
      const themeToggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('swc_theme') || 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.textContent = currentTheme === 'light' ? '深色' : '亮色';
      themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('swc_theme', newTheme);
        themeToggle.textContent = newTheme === 'light' ? '深色' : '亮色';
      });

      const fpsDisplay = document.getElementById('fpsDisplay');
      let frameCount = 0, lastFpsUpdate = performance.now();
      function updateFPS() {
        frameCount++;
        const now = performance.now();
        if(now - lastFpsUpdate >= 1000) {
          fpsDisplay.textContent = `FPS: ${Math.round((frameCount * 1000) / (now - lastFpsUpdate))}`;
          frameCount = 0; lastFpsUpdate = now;
        }
        requestAnimationFrame(updateFPS);
      }
      requestAnimationFrame(updateFPS);

      // ========== 检测逻辑 ==========
      const LIST_URL = 'https://os.743.world/wav/music.list';
      const resultsEl = document.getElementById('results');
      const progressEl = document.getElementById('progress');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');

      let abortController = null;
      let stopped = false;

      function extractName(url) {
        try {
          const path = new URL(url).pathname;
          const parts = path.split('/').filter(Boolean);
          if (parts.length === 0) return url;
          const filename = parts[parts.length - 1];
          return filename;
        } catch {
          return url.split('/').pop() || url;
        }
      }

      async function checkUrl(url, signal) {
        // 过滤无效协议
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          alert(`[DEBUG] 跳过无效链接 (协议不支持): ${url}`);
          return false;
        }
        try {
          const response = await fetch(url, { method: 'HEAD', signal });
          return response.ok;
        } catch (e) {
          if (e.name === 'AbortError') throw e;
          // HEAD 失败尝试 GET
          try {
            const resp = await fetch(url, { method: 'GET', signal });
            return resp.ok;
          } catch (e2) {
            if (e2.name === 'AbortError') throw e2;
            alert(`[DEBUG] 无法访问文件: ${url}\n错误: ${e2.message}`);
            return false;
          }
        }
      }

      function renderResult(name, url, ok) {
        const div = document.createElement('div');
        div.className = `result-item ${ok ? 'ok' : 'fail'}`;
        div.innerHTML = `
          <span style="word-break:break-all;margin-right:8px;">${name}</span>
          <span class="status ${ok ? 'ok' : 'fail'}">${ok ? '✅ 存在' : '❌ 不存在'}</span>
        `;
        resultsEl.appendChild(div);
      }

      async function startCheck() {
        resultsEl.innerHTML = '';
        progressEl.textContent = '正在加载列表...';
        stopped = false;
        abortController = new AbortController();
        const signal = abortController.signal;

        try {
          const listResp = await fetch(LIST_URL, { signal });
          if (!listResp.ok) {
            alert(`[DEBUG] 无法加载列表文件: HTTP ${listResp.status}`);
            progressEl.textContent = '加载列表失败';
            return;
          }
          const text = await listResp.text();
          const lines = text.split('\n').map(l => l.trim()).filter(l => l);
          if (lines.length === 0) {
            alert('[DEBUG] 列表为空');
            progressEl.textContent = '列表为空';
            return;
          }

          // 过滤 blob、data 等无效链接
          const validLines = [];
          for (const url of lines) {
            if (url.startsWith('blob:') || url.startsWith('data:')) {
              alert(`[DEBUG] 检测到无效链接 (blob/data)，已自动跳过:\n${url}`);
            } else {
              validLines.push(url);
            }
          }

          if (validLines.length === 0) {
            alert('[DEBUG] 列表中全部是无效链接');
            progressEl.textContent = '无有效链接';
            return;
          }

          progressEl.textContent = `共 ${validLines.length} 个文件，开始检测...`;

          let checked = 0;
          for (const url of validLines) {
            if (stopped) break;
            const name = extractName(url);
            try {
              const ok = await checkUrl(url, signal);
              renderResult(name, url, ok);
              if (!ok) {
                alert(`[DEBUG] 文件不存在或无法访问:\n${url}`);
              }
            } catch (e) {
              if (e.name === 'AbortError') break;
              renderResult(name, url, false);
              alert(`[DEBUG] 检测异常: ${name}\n${e.message}`);
            }
            checked++;
            progressEl.textContent = `已检测：${checked}/${validLines.length}`;
          }

          progressEl.textContent = stopped ? '检测已停止' : '检测完毕';
        } catch (e) {
          if (e.name !== 'AbortError') {
            alert('[DEBUG] 检测过程发生异常: ' + e.message);
            progressEl.textContent = '检测出错';
          }
        }
      }

      btnStart.addEventListener('click', () => startCheck());
      btnStop.addEventListener('click', () => {
        stopped = true;
        if (abortController) abortController.abort();
        progressEl.textContent = '正在停止...';
      });
    })();
  </script>
</body>
</html>
