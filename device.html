<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Info - SwCTools</title>
  <style>
    /* ---------- 深色主题 (与主站保持一致，若主站已有定义可整体替换) ---------- */
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-emphasis: #1f6feb;
      --danger: #f85149;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      -webkit-tap-highlight-color: transparent;
    }

    /* 角落水印 */
    .corner-watermark {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      opacity: 0.5;
      letter-spacing: 0.5px;
      z-index: 1000;
      pointer-events: none;
    }

    /* FPS 计数器 */
    .fps-counter {
      position: fixed;
      top: 12px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: var(--accent);
      font-family: monospace;
      z-index: 1001;
    }

    /* 返回主站按钮 */
    .back-btn {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: var(--border);
    }

    /* 主容器 */
    .container {
      width: 100%;
      max-width: 960px;
      margin-top: 4rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--text);
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    /* 基本信息网格 */
    .basic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .info-card .label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }
    .info-card .value {
      font-size: 1.1rem;
      font-weight: 500;
      word-break: break-word;
    }
    .live-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      background: var(--accent);
    }

    /* 按钮组 */
    .modal-triggers {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .modal-triggers button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .modal-triggers button:hover {
      background: var(--accent-emphasis);
      border-color: var(--accent);
    }

    .refresh-btn {
      background: var(--accent-emphasis);
      border: none;
      color: white;
      padding: 10px 28px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover {
      opacity: 0.9;
    }

    /* 模态框 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      color: var(--text);
    }
    .modal-content h3 {
      margin-bottom: 1rem;
      font-size: 1.3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-content .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .detail-item .d-label {
      color: var(--text-secondary);
    }
    .detail-item .d-value {
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }

    @media (max-width: 480px) {
      body { padding: 1rem; }
      .back-btn { top: 0.8rem; left: 0.8rem; padding: 6px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <!-- FPS 计数器 -->
  <div class="fps-counter" id="fpsCounter">FPS: --</div>

  <!-- 角落水印 -->
  <div class="corner-watermark">SwCTools Device</div>

  <!-- 返回主站 -->
  <a href="index.html" class="back-btn">← 返回主站</a>

  <div class="container">
    <h1>📱 完整设备信息</h1>
    <p class="subtitle">实时硬件与软件详情 · 每秒自动刷新</p>

    <!-- 基本信息区域（直接可见） -->
    <div class="basic-grid" id="basicInfoGrid">
      <!-- 动态填充 JS -->
    </div>

    <!-- 分类模态框按钮 -->
    <div class="modal-triggers" id="modalTriggers">
      <!-- 动态生成 11 个按钮 -->
    </div>

    <button class="refresh-btn" id="refreshAllBtn">🔄 刷新所有信息</button>

    <!-- 模态框容器 (由JS动态管理) -->
    <div id="modalContainer"></div>
  </div>

  <script>
    (function() {
      // ---------- FPS 监测 ----------
      let fpsFrames = 0, fpsLastTime = performance.now();
      function updateFPS() {
        fpsFrames++;
        const now = performance.now();
        if (now - fpsLastTime >= 1000) {
          const fps = Math.round((fpsFrames * 1000) / (now - fpsLastTime));
          document.getElementById('fpsCounter').textContent = `FPS: ${fps}`;
          fpsFrames = 0;
          fpsLastTime = now;
        }
        requestAnimationFrame(updateFPS);
      }
      updateFPS();

      // ---------- 全局数据存储 ----------
      let deviceData = {
        systemArch: '采集中...',
        publicIP: '获取中...',
        localIP: '获取中...',
        screen: {},
        battery: {},
        network: {},
        gpu: '检测中...',
        storage: {},
        brightness: '未知',
        mediaDevices: [],
        language: navigator.language || '未知',
        online: navigator.onLine,
        cpuCores: navigator.hardwareConcurrency || '未知',
        memory: navigator.deviceMemory || '未知',
        ua: navigator.userAgent,
        // 高级信息
        userAgentData: null,
        sensors: {},
        peripherals: {},
        webxr: false,
        features: {},
      };

      // ---------- 工具函数 ----------
      function safeGet(fn, fallback = '不支持') {
        try { return fn(); } catch (e) { return fallback; }
      }

      // 获取本地 IP（WebRTC 方式）
      async function getLocalIP() {
        return new Promise((resolve) => {
          const pc = new RTCPeerConnection({ iceServers: [] });
          pc.createDataChannel('');
          pc.createOffer().then(offer => pc.setLocalDescription(offer));
          pc.onicecandidate = (e) => {
            if (!e.candidate) return;
            const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
            const match = e.candidate.candidate.match(ipRegex);
            if (match) {
              resolve(match[0]);
              pc.close();
            }
          };
          setTimeout(() => resolve('未获取到'), 2000);
        });
      }

      // 获取公网 IP
      async function getPublicIP() {
        try {
          const res = await fetch('https://api.ipify.org?format=json');
          const data = await res.json();
          return data.ip;
        } catch (e) {
          return '获取失败';
        }
      }

      // ---------- 核心采集函数 ----------
      async function collectAllData() {
        // 并行采集所有独立数据
        const [
          publicIP,
          localIP,
          batteryInfo,
          networkInfo,
          storageInfo,
          mediaDevices,
          gpuInfo,
          brightnessVal,
          highEntropyData,
          sensorsSupport,
          peripheralsSupport,
          webxrSupport,
          featuresSupport
        ] = await Promise.all([
          getPublicIP(),
          getLocalIP(),
          getBatteryInfo(),
          getNetworkInfo(),
          getStorageInfo(),
          getMediaDevices(),
          getGPUInfo(),
          getBrightness(),
          getHighEntropyData(),
          checkSensors(),
          checkPeripherals(),
          checkWebXR(),
          checkFeatures()
        ]);

        // 更新全局数据
        deviceData.publicIP = publicIP;
        deviceData.localIP = localIP;
        deviceData.battery = batteryInfo;
        deviceData.network = networkInfo;
        deviceData.storage = storageInfo;
        deviceData.mediaDevices = mediaDevices;
        deviceData.gpu = gpuInfo;
        deviceData.brightness = brightnessVal;
        deviceData.userAgentData = highEntropyData;
        deviceData.sensors = sensorsSupport;
        deviceData.peripherals = peripheralsSupport;
        deviceData.webxr = webxrSupport;
        deviceData.features = featuresSupport;
        deviceData.online = navigator.onLine;

        // 屏幕信息 (非异步)
        deviceData.screen = {
          logical: `${window.screen.width}x${window.screen.height}`,
          physical: `${window.screen.width * window.devicePixelRatio}x${window.screen.height * window.devicePixelRatio}`,
          dpr: window.devicePixelRatio,
          viewport: `${window.innerWidth}x${window.innerHeight}`,
          colorDepth: window.screen.colorDepth,
        };

        // 系统架构优先使用 userAgentData，否则回退
        if (highEntropyData?.platform) {
          deviceData.systemArch = highEntropyData.platform;
        } else {
          deviceData.systemArch = navigator.platform || '未知';
        }
        // 如果有完整版本列表则附加品牌
        if (highEntropyData?.fullVersionList) {
          const brands = highEntropyData.fullVersionList.map(b => `${b.brand} ${b.version}`).join(' / ');
          deviceData.systemArch += ` (${brands})`;
        }

        // CPU/内存实时部分稍后更新
        updateBasicUI();
        updateAllOpenModals();
      }

      // ---------- 各单项采集实现 ----------
      async function getBatteryInfo() {
        if (!navigator.getBattery) return { level: '不支持', charging: '不支持' };
        try {
          const battery = await navigator.getBattery();
          return {
            level: (battery.level * 100).toFixed(0) + '%',
            charging: battery.charging ? '充电中' : '未充电',
            chargingTime: battery.chargingTime === Infinity ? 'N/A' : battery.chargingTime + 's',
            dischargingTime: battery.dischargingTime === Infinity ? 'N/A' : battery.dischargingTime + 's'
          };
        } catch (e) {
          return { level: '错误', charging: '错误' };
        }
      }

      async function getNetworkInfo() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!conn) return { effectiveType: '不支持', downlink: '不支持', rtt: '不支持' };
        return {
          effectiveType: conn.effectiveType || '未知',
          downlink: conn.downlink ? conn.downlink + ' Mbps' : '未知',
          rtt: conn.rtt ? conn.rtt + ' ms' : '未知',
          saveData: conn.saveData ? '已开启' : '关闭'
        };
      }

      async function getStorageInfo() {
        if (!navigator.storage?.estimate) return { quota: '不支持', usage: '不支持' };
        try {
          const estimate = await navigator.storage.estimate();
          const quota = estimate.quota ? (estimate.quota / 1e9).toFixed(1) + ' GB' : '未知';
          const usage = estimate.usage ? (estimate.usage / 1e9).toFixed(2) + ' GB' : '未知';
          const percent = estimate.quota && estimate.usage ? ((estimate.usage / estimate.quota) * 100).toFixed(1) + '%' : 'N/A';
          return { quota, usage, percent };
        } catch (e) {
          return { quota: '错误', usage: '错误' };
        }
      }

      async function getMediaDevices() {
        if (!navigator.mediaDevices?.enumerateDevices) return [];
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          return devices.map(d => ({ kind: d.kind, label: d.label || '未命名', deviceId: d.deviceId.slice(0,8) + '...' }));
        } catch (e) {
          return [];
        }
      }

      async function getGPUInfo() {
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (!gl) return '不支持 WebGL';
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
          return 'WebGL 支持但无法获取渲染器';
        } catch (e) {
          return '检测失败';
        }
      }

      async function getBrightness() {
        // 实验性 API (仅部分 Chromium 支持)
        if ('getScreenBrightness' in navigator) {
          try {
            const brightness = await navigator.getScreenBrightness();
            return (brightness * 100).toFixed(0) + '%';
          } catch (e) {}
        }
        // 尝试通过 Battery API 相关属性？ 无标准方法
        return '不支持';
      }

      async function getHighEntropyData() {
        if (!navigator.userAgentData?.getHighEntropyValues) return null;
        try {
          const data = await navigator.userAgentData.getHighEntropyValues([
            "architecture", "bitness", "model", "platform", "platformVersion", "fullVersionList"
          ]);
          return {
            architecture: data.architecture,
            bitness: data.bitness,
            model: data.model,
            platform: data.platform,
            platformVersion: data.platformVersion,
            fullVersionList: data.fullVersionList,
            brands: navigator.userAgentData.brands,
            mobile: navigator.userAgentData.mobile
          };
        } catch (e) {
          return null;
        }
      }

      function checkSensors() {
        return {
          accelerometer: 'Accelerometer' in window,
          gyroscope: 'Gyroscope' in window,
          magnetometer: 'Magnetometer' in window,
          ambientLight: 'AmbientLightSensor' in window,
          proximity: 'ProximitySensor' in window,
        };
      }

      function checkPeripherals() {
        return {
          bluetooth: 'bluetooth' in navigator,
          usb: 'usb' in navigator,
          serial: 'serial' in navigator,
          hid: 'hid' in navigator,
          nfc: 'NDEFReader' in window,
          midi: 'requestMIDIAccess' in navigator,
        };
      }

      function checkWebXR() {
        return 'xr' in navigator && 'XRSystem' in window;
      }

      function checkFeatures() {
        return {
          webGPU: 'gpu' in navigator,
          serviceWorker: 'serviceWorker' in navigator,
          webShare: 'share' in navigator,
          webBluetooth: 'bluetooth' in navigator,
          webUSB: 'usb' in navigator,
          paymentRequest: 'PaymentRequest' in window,
          credentialManagement: 'credentials' in navigator,
          contactPicker: 'contacts' in navigator,
          fileSystemAccess: 'showOpenFilePicker' in window,
          screenWakeLock: 'wakeLock' in navigator,
          clipboardRead: 'clipboard' in navigator && 'read' in navigator.clipboard,
          idleDetection: 'IdleDetector' in window,
        };
      }

      // ---------- UI 更新 ----------
      function updateBasicUI() {
        const grid = document.getElementById('basicInfoGrid');
        const items = [
          { label: '系统架构', value: deviceData.systemArch },
          { label: '公网 IP', value: deviceData.publicIP },
          { label: '本地 IP', value: deviceData.localIP },
          { label: '屏幕 (逻辑)', value: deviceData.screen.logical },
          { label: '屏幕 (物理)', value: deviceData.screen.physical },
          { label: 'DPR', value: deviceData.screen.dpr },
          { label: '视口', value: deviceData.screen.viewport },
          { label: '电池', value: deviceData.battery.level + ' · ' + deviceData.battery.charging },
          { label: '网络', value: deviceData.network.effectiveType || '未知' },
          { label: 'GPU', value: deviceData.gpu },
          { label: '存储 (已用/总额)', value: deviceData.storage.usage + ' / ' + deviceData.storage.quota },
          { label: '亮度', value: deviceData.brightness },
          { label: '语言', value: deviceData.language },
          { label: '在线状态', value: deviceData.online ? '在线' : '离线' },
          { label: 'CPU 核心', value: deviceData.cpuCores },
          { label: '内存 (GB)', value: deviceData.memory },
          { label: 'UA 字符串', value: deviceData.ua.length > 60 ? deviceData.ua.substring(0,60)+'...' : deviceData.ua },
        ];

        grid.innerHTML = items.map(item => `
          <div class="info-card">
            <span class="label">${item.label}</span>
            <span class="value">${item.value}</span>
          </div>
        `).join('');
      }

      // 模态框管理
      const modalCategories = [
        { id: 'battery', title: '🔋 电池详情' },
        { id: 'network', title: '📶 网络详情' },
        { id: 'storage', title: '💾 存储详情' },
        { id: 'brightness', title: '☀️ 屏幕亮度' },
        { id: 'media', title: '🎥 媒体设备' },
        { id: 'language', title: '🌐 语言与地区' },
        { id: 'online', title: '🔌 在线状态' },
        { id: 'cpu', title: '🧠 CPU & 内存' },
        { id: 'gpu', title: '🎮 GPU 信息' },
        { id: 'sensors', title: '📡 传感器支持' },
        { id: 'peripherals', title: '🖥️ 外设支持' },
        { id: 'webxr', title: '🥽 WebXR' },
        { id: 'features', title: '✨ 系统特性' }
      ];

      // 动态创建按钮
      const triggerContainer = document.getElementById('modalTriggers');
      modalCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.title;
        btn.addEventListener('click', () => openModal(cat.id));
        triggerContainer.appendChild(btn);
      });

      // 创建模态框容器
      const modalContainer = document.getElementById('modalContainer');
      modalCategories.forEach(cat => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = `modal-${cat.id}`;
        overlay.innerHTML = `
          <div class="modal-content">
            <button class="modal-close" data-close="${cat.id}">✕</button>
            <h3>${cat.title}</h3>
            <div id="modal-body-${cat.id}" class="modal-body"></div>
          </div>
        `;
        modalContainer.appendChild(overlay);
      });

      // 关闭按钮事件委托
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-close')) {
          const id = e.target.dataset.close;
          closeModal(id);
        }
        if (e.target.classList.contains('modal-overlay')) {
          e.target.classList.remove('active');
        }
      });

      function openModal(id) {
        const overlay = document.getElementById(`modal-${id}`);
        if (overlay) {
          overlay.classList.add('active');
          updateModalContent(id);
        }
      }

      function closeModal(id) {
        const overlay = document.getElementById(`modal-${id}`);
        if (overlay) overlay.classList.remove('active');
      }

      // 更新指定模态框内容
      function updateModalContent(id) {
        const body = document.getElementById(`modal-body-${id}`);
        if (!body) return;
        const d = deviceData;
        let html = '';
        switch(id) {
          case 'battery':
            html = renderDetailItems([
              ['电量', d.battery.level],
              ['充电状态', d.battery.charging],
              ['充电时间', d.battery.chargingTime],
              ['放电时间', d.battery.dischargingTime]
            ]);
            break;
          case 'network':
            html = renderDetailItems([
              ['网络类型', d.network.effectiveType],
              ['下行带宽', d.network.downlink],
              ['RTT', d.network.rtt],
              ['省流量模式', d.network.saveData]
            ]);
            break;
          case 'storage':
            html = renderDetailItems([
              ['已用空间', d.storage.usage],
              ['总额配额', d.storage.quota],
              ['使用率', d.storage.percent]
            ]);
            break;
          case 'brightness':
            html = renderDetailItems([['屏幕亮度', d.brightness]]);
            break;
          case 'media':
            if (d.mediaDevices.length === 0) {
              html = '<p>无媒体设备信息或权限未授予</p>';
            } else {
              html = d.mediaDevices.map(m => `<div class="detail-item"><span class="d-label">${m.kind}</span><span class="d-value">${m.label}</span></div>`).join('');
            }
            break;
          case 'language':
            html = renderDetailItems([
              ['界面语言', d.language],
              ['时区', Intl.DateTimeFormat().resolvedOptions().timeZone],
              ['日期格式', new Intl.DateTimeFormat().format(new Date())]
            ]);
            break;
          case 'online':
            html = renderDetailItems([['状态', d.online ? '在线' : '离线']]);
            break;
          case 'cpu':
            html = renderDetailItems([
              ['逻辑核心数', d.cpuCores],
              ['设备内存 (GB)', d.memory],
              ['User-Agent', d.ua.substring(0, 80) + (d.ua.length>80?'...':'')]
            ]);
            break;
          case 'gpu':
            html = renderDetailItems([['GPU 渲染器', d.gpu]]);
            if (d.features.webGPU) {
              html += '<p style="color: var(--accent); margin-top: 0.5rem;">✅ WebGPU 已支持</p>';
            } else {
              html += '<p style="color: var(--text-secondary); margin-top: 0.5rem;">⚠️ WebGPU 未支持或需开启 flag</p>';
            }
            break;
          case 'sensors':
            html = renderDetailItems(Object.entries(d.sensors).map(([k,v]) => [k, v ? '✅' : '❌']));
            break;
          case 'peripherals':
            html = renderDetailItems(Object.entries(d.peripherals).map(([k,v]) => [k, v ? '✅' : '❌']));
            break;
          case 'webxr':
            html = renderDetailItems([['WebXR 支持', d.webxr ? '✅ 支持' : '❌ 不支持']]);
            break;
          case 'features':
            html = renderDetailItems(Object.entries(d.features).map(([k,v]) => [k, v ? '✅' : '❌']));
            break;
        }
        body.innerHTML = html;
      }

      function renderDetailItems(items) {
        return items.map(([label, value]) => `
          <div class="detail-item">
            <span class="d-label">${label}</span>
            <span class="d-value">${value}</span>
          </div>
        `).join('');
      }

      function updateAllOpenModals() {
        modalCategories.forEach(cat => {
          const overlay = document.getElementById(`modal-${cat.id}`);
          if (overlay && overlay.classList.contains('active')) {
            updateModalContent(cat.id);
          }
        });
      }

      // ---------- 实时监测 (每秒) ----------
      async function liveUpdate() {
        // 电池
        if (navigator.getBattery) {
          const battery = await navigator.getBattery();
          deviceData.battery.level = (battery.level * 100).toFixed(0) + '%';
          deviceData.battery.charging = battery.charging ? '充电中' : '未充电';
          deviceData.battery.chargingTime = battery.chargingTime === Infinity ? 'N/A' : battery.chargingTime + 's';
          deviceData.battery.dischargingTime = battery.dischargingTime === Infinity ? 'N/A' : battery.dischargingTime + 's';
        }
        // 网络
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
          deviceData.network.effectiveType = conn.effectiveType;
          deviceData.network.downlink = conn.downlink ? conn.downlink + ' Mbps' : '未知';
          deviceData.network.rtt = conn.rtt ? conn.rtt + ' ms' : '未知';
        }
        // 在线状态
        deviceData.online = navigator.onLine;
        // 存储快读刷新（异步，可能不变）
        if (navigator.storage?.estimate) {
          try {
            const est = await navigator.storage.estimate();
            deviceData.storage.usage = est.usage ? (est.usage / 1e9).toFixed(2) + ' GB' : '未知';
            deviceData.storage.quota = est.quota ? (est.quota / 1e9).toFixed(1) + ' GB' : '未知';
            const pct = est.quota && est.usage ? ((est.usage / est.quota)*100).toFixed(1)+'%' : 'N/A';
            deviceData.storage.percent = pct;
          } catch(e) {}
        }
        // 亮度（实验性）
        if ('getScreenBrightness' in navigator) {
          try {
            const b = await navigator.getScreenBrightness();
            deviceData.brightness = (b * 100).toFixed(0) + '%';
          } catch(e){}
        }

        updateBasicUI();
        updateAllOpenModals();
      }

      // 启动实时循环
      setInterval(liveUpdate, 1000);

      // 刷新所有按钮
      document.getElementById('refreshAllBtn').addEventListener('click', () => {
        collectAllData();
      });

      // 初次加载
      collectAllData();

      // 监听在线/离线事件更新UI
      window.addEventListener('online', () => { deviceData.online = true; updateBasicUI(); updateAllOpenModals(); });
      window.addEventListener('offline', () => { deviceData.online = false; updateBasicUI(); updateAllOpenModals(); });
    })();
  </script>
</body>
</html>
