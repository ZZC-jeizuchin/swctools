<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="baiduspider" content="noindex, nofollow">
  <meta name="yandex" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">
  <title>设备信息 - SwCTools</title>
  <style>
    :root {
      --bg-body: #e8edf2;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: #bdd1e6;
      --title-color: #1e4b6e;
      --badge-bg: #d0e2f0;
      --badge-color: #2c6182;
      --cat-btn-bg: #d9e8f4;
      --cat-btn-border: #adc7e0;
      --cat-btn-color: #1a4059;
      --cat-btn-hover-bg: #c2d8ed;
      --jump-row-bg: #e7f0f9;
      --jump-row-border: #c1d6ea;
      --input-border: #b3cce2;
      --input-focus-border: #4f7fa3;
      --go-btn-bg: #4f7f9e;
      --go-btn-hover-bg: #3a6b8c;
      --tool-btn-bg: #cddef0;
      --tool-btn-border: #a3bed8;
      --tool-btn-color: #1a4765;
      --modal-overlay-bg: rgba(22, 50, 70, 0.25);
      --modal-card-bg: #f3f9ff;
      --link-item-bg: #d9e8f4;
      --link-item-border: #adc7e0;
      --drawer-panel-bg: #f3f9ff;
      --device-item-bg: #eaf2fc;
      --device-label-color: #1e4b6e;
      --device-value-color: #0d3450;
      --text-color: #173e58;
      --corner-text-color: #3a6a8e;
      --fps-bg: rgba(255, 255, 255, 0.6);
    }

    [data-theme="dark"] {
      --bg-body: #0a0f14;
      --panel-bg: rgba(13, 27, 42, 0.9);
      --panel-border: #1e3a5a;
      --title-color: #a0c4e8;
      --badge-bg: #1a3a5c;
      --badge-color: #b0d0f0;
      --cat-btn-bg: #1e3a5a;
      --cat-btn-border: #2a5a8a;
      --cat-btn-color: #c0d8f0;
      --cat-btn-hover-bg: #2a5a8a;
      --jump-row-bg: #122a3e;
      --jump-row-border: #1e4a6e;
      --input-border: #2a5a8a;
      --input-focus-border: #5a9ac0;
      --go-btn-bg: #2a6a9e;
      --go-btn-hover-bg: #1a4a7a;
      --tool-btn-bg: #1e3a5a;
      --tool-btn-border: #2a5a8a;
      --tool-btn-color: #c0d8f0;
      --modal-overlay-bg: rgba(0, 20, 40, 0.5);
      --modal-card-bg: #0d1b2a;
      --link-item-bg: #1e3a5a;
      --link-item-border: #2a5a8a;
      --drawer-panel-bg: #0d1b2a;
      --device-item-bg: #122a3e;
      --device-label-color: #a0c4e8;
      --device-value-color: #d0e0f0;
      --text-color: #c0d8f0;
      --corner-text-color: #7a9ab0;
      --fps-bg: rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: var(--bg-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
    }

    button, a, input, select, .drawer-overlay, .modal-overlay, .drawer-panel, .modal-card,
    .cat-btn, .go-btn, .tool-btn, .nav-btn, .link-item, .run-ide-btn,
    .theme-toggle, .perf-toggle {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .corner-tl { position: fixed; top: calc(var(--main-h) * 0.015); left: calc(var(--main-w) * 0.015); font-size: calc(var(--main-h) * 0.026); color: var(--corner-text-color); opacity: 0.8; z-index: 3000; pointer-events: none; }
    .corner-tr { position: fixed; top: calc(var(--main-h) * 0.015); right: calc(var(--main-w) * 0.02); font-size: calc(var(--main-h) * 0.026); color: var(--corner-text-color); opacity: 0.8; z-index: 3000; pointer-events: none; background: var(--fps-bg); padding: calc(var(--main-h) * 0.005) calc(var(--main-w) * 0.012); border-radius: calc(var(--main-w) * 0.02); border: 1px solid var(--panel-border); }
    .corner-br { position: fixed; bottom: calc(var(--main-h) * 0.015); right: calc(var(--main-w) * 0.02); font-size: calc(var(--main-h) * 0.026); color: var(--corner-text-color); opacity: 0.8; z-index: 3000; pointer-events: none; }

    .theme-toggle, .perf-toggle {
      position: fixed; bottom: 12px; font-size: 0.9rem; background: var(--cat-btn-bg); border: 1px solid var(--panel-border); color: var(--corner-text-color); padding: 5px 14px; border-radius: 32px; cursor: pointer; opacity: 0.85; transition: 0.2s; z-index: 3000; font-weight: 500;
    }
    .theme-toggle { left: 16px; } .perf-toggle { left: 100px; }
    .theme-toggle:hover, .perf-toggle:hover { opacity: 1; background: var(--cat-btn-hover-bg); }

    .main-panel {
      width:  min(96vw, calc(96vh * 2.5));
      height: min(96vh, calc(96vw / 1.33));
      margin: auto;
      background: var(--panel-bg);
      border-radius: calc(var(--main-w) * 0.025);
      box-shadow: 0 calc(var(--main-h) * 0.015) calc(var(--main-h) * 0.03) calc(var(--main-h) * -0.008) rgba(30, 65, 90, 0.18);
      border: 1px solid var(--panel-border);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    .main-panel.device-page {
      overflow-y: auto;
    }

    .title-section {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: calc(var(--main-h) * 0.003) solid var(--panel-border);
      padding: calc(var(--main-h) * 0.015) calc(var(--main-w) * 0.02);
    }
    .title-section h1 { font-size: calc(var(--main-h) * 0.065); font-weight: 550; color: var(--title-color); white-space: nowrap; }
    .badge { font-size: calc(var(--main-h) * 0.039); color: var(--badge-color); background: var(--badge-bg); padding: calc(var(--main-h) * 0.01) calc(var(--main-w) * 0.025); border-radius: calc(var(--main-w) * 0.04); border: 1px solid var(--cat-btn-border); white-space: nowrap; }

    .back-btn {
      background: var(--cat-btn-bg); border: 1px solid var(--cat-btn-border); color: var(--cat-btn-color);
      padding: calc(var(--main-h) * 0.015) calc(var(--main-w) * 0.025);
      border-radius: calc(var(--main-w) * 0.05);
      font-size: calc(var(--main-h) * 0.0325); font-weight: 520;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
      transition: all 0.15s; white-space: nowrap;
    }
    .back-btn:hover { background: var(--cat-btn-hover-bg); }

    .basic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: calc(var(--main-w) * 0.02);
      padding: calc(var(--main-h) * 0.02) calc(var(--main-w) * 0.02);
    }
    .info-card {
      background: var(--device-item-bg);
      border: 1px solid var(--panel-border);
      border-radius: calc(var(--main-w) * 0.03);
      padding: calc(var(--main-h) * 0.018) calc(var(--main-w) * 0.02);
    }
    .info-card .label {
      font-size: calc(var(--main-h) * 0.028);
      color: var(--device-label-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.4em;
    }
    .info-card .value {
      font-size: calc(var(--main-h) * 0.036);
      font-weight: 500;
      color: var(--device-value-color);
      word-break: break-word;
    }

    .modal-triggers {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--main-w) * 0.015);
      padding: 0 calc(var(--main-w) * 0.02);
      margin: calc(var(--main-h) * 0.01) 0;
    }
    .modal-triggers button {
      background: var(--cat-btn-bg);
      border: 1px solid var(--cat-btn-border);
      color: var(--cat-btn-color);
      padding: calc(var(--main-h) * 0.018) calc(var(--main-w) * 0.03);
      border-radius: calc(var(--main-w) * 0.05);
      font-size: calc(var(--main-h) * 0.0325);
      font-weight: 520;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .modal-triggers button:hover {
      background: var(--cat-btn-hover-bg);
      border-color: #7fa5c5;
    }

    .refresh-btn {
      background: var(--go-btn-bg);
      border: none;
      color: white;
      padding: calc(var(--main-h) * 0.025) calc(var(--main-w) * 0.04);
      border-radius: calc(var(--main-w) * 0.07);
      font-size: calc(var(--main-h) * 0.039);
      font-weight: 600;
      cursor: pointer;
      margin: calc(var(--main-h) * 0.02) auto;
      display: block;
      transition: all 0.15s;
    }
    .refresh-btn:hover { background: var(--go-btn-hover-bg); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--modal-overlay-bg);
      backdrop-filter: blur(3px);
      visibility: hidden; opacity: 0;
      transition: opacity 0.2s, visibility 0s 0.2s;
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay.show {
      visibility: visible; opacity: 1;
      transition: opacity 0.2s, visibility 0s;
    }
    .modal-card {
      background: var(--modal-card-bg);
      width: 90vw; max-width: 600px; max-height: 70vh;
      border-radius: calc(var(--main-w) * 0.04);
      border: 1px solid var(--panel-border);
      box-shadow: 0 calc(var(--main-h) * 0.02) calc(var(--main-h) * 0.04) rgba(28, 60, 84, 0.25);
      padding: calc(var(--main-h) * 0.03) calc(var(--main-w) * 0.03);
      overflow-y: auto;
      position: relative;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: calc(var(--main-h) * 0.02);
      border-bottom: calc(var(--main-h) * 0.002) solid var(--panel-border);
      padding-bottom: calc(var(--main-h) * 0.01);
    }
    .modal-header h3 { font-size: calc(var(--main-h) * 0.0676); color: var(--title-color); }
    .modal-close {
      background: none; border: none; font-size: calc(var(--main-h) * 0.091);
      cursor: pointer; color: var(--corner-text-color); line-height: 1;
    }
    .detail-item {
      display: flex; justify-content: space-between; padding: 0.6em 0;
      border-bottom: 1px solid var(--panel-border); font-size: calc(var(--main-h) * 0.034);
      color: var(--text-color);
    }
    .detail-item .d-label { color: var(--device-label-color); }
    .detail-item .d-value { font-weight: 500; text-align: right; word-break: break-word; max-width: 60%; }

    .ua-full {
      font-family: monospace; font-size: calc(var(--main-h) * 0.028); word-break: break-all;
      background: var(--device-item-bg); border: 1px solid var(--panel-border);
      padding: calc(var(--main-h) * 0.01) calc(var(--main-w) * 0.02);
      border-radius: calc(var(--main-w) * 0.03);
      margin: calc(var(--main-h) * 0.01) calc(var(--main-w) * 0.02);
      color: var(--text-color);
    }

    .perf-mode .cat-btn, .perf-mode .go-btn, .perf-mode .tool-btn, .perf-mode .nav-btn,
    .perf-mode .link-item, .perf-mode .run-ide-btn, .perf-mode .theme-toggle, .perf-mode .perf-toggle,
    .perf-mode button { transition: none !important; transform: none !important; box-shadow: none !important; }
    .perf-mode .cat-btn:hover, .perf-mode .go-btn:hover, .perf-mode .tool-btn:hover,
    .perf-mode .nav-btn:hover, .perf-mode .link-item:hover, .perf-mode .run-ide-btn:hover,
    .perf-mode .theme-toggle:hover, .perf-mode .perf-toggle:hover { background: var(--cat-btn-hover-bg); border-color: #7fa5c5; }
    .perf-mode .modal-overlay { transition: none !important; backdrop-filter: none !important; }
    .perf-mode .modal-card { transform: none !important; filter: none !important; transition: none !important; }
    .perf-mode .main-panel, .perf-mode .modal-card { box-shadow: none !important; }
  </style>
</head>
<body>
  <div class="corner-tl">不自由毋宁死 · 不自由毋寧死 · Give me liberty or give me death · 自由か、死か</div>
  <div class="corner-tr" id="fpsDisplay">FPS: --</div>
  <div class="corner-br">made by ZZC-jeizuchin, github</div>
  <button class="theme-toggle" id="themeToggle">深色</button>
  <button class="perf-toggle" id="perfToggle">性能</button>

  <div class="main-panel device-page" id="mainPanel">
    <div class="title-section">
      <a href="index.html" class="back-btn">← 返回主站</a>
      <h1>设备信息</h1>
      <span class="badge">Device</span>
    </div>

    <!-- 基本信息网格（直接可见） -->
    <div class="basic-grid" id="basicInfoGrid"></div>

    <!-- UA完整字符串单独展示 -->
    <div class="ua-full" id="uaFull"></div>

    <!-- 分类详情按钮组 -->
    <div class="modal-triggers" id="modalTriggers"></div>

    <button class="refresh-btn" id="refreshAllBtn">刷新所有信息</button>
  </div>

  <!-- 模态框容器 -->
  <div class="modal-overlay" id="deviceModal">
    <div class="modal-card" id="deviceModalCard">
      <div class="modal-header">
        <h3 id="modalTitle">详情</h3>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    (function() {
      const mainPanel = document.getElementById('mainPanel');
      const root = document.documentElement;

      function updatePanelScale() {
        const w = mainPanel.clientWidth;
        const h = mainPanel.clientHeight;
        root.style.setProperty('--main-w', w + 'px');
        root.style.setProperty('--main-h', h + 'px');
      }
      window.addEventListener('resize', updatePanelScale);
      window.addEventListener('orientationchange', updatePanelScale);
      setTimeout(updatePanelScale, 10);

      const themeToggle = document.getElementById('themeToggle');
      const currentTheme = localStorage.getItem('swc_theme') || 'light';
      document.documentElement.setAttribute('data-theme', currentTheme);
      themeToggle.textContent = currentTheme === 'light' ? '深色' : '亮色';
      themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('swc_theme', newTheme);
        themeToggle.textContent = newTheme === 'light' ? '深色' : '亮色';
        setTimeout(updatePanelScale, 0);
      });

      const perfToggle = document.getElementById('perfToggle');
      if (localStorage.getItem('swc_perf') === 'true') document.body.classList.add('perf-mode');
      perfToggle.textContent = document.body.classList.contains('perf-mode') ? '性能 ✓' : '性能';
      perfToggle.addEventListener('click', () => {
        const enabled = document.body.classList.toggle('perf-mode');
        localStorage.setItem('swc_perf', enabled);
        perfToggle.textContent = enabled ? '性能 ✓' : '性能';
      });

      const fpsDisplay = document.getElementById('fpsDisplay');
      let frameCount = 0, lastFpsUpdate = performance.now(), rafId = null;
      function fpsLoop() {
        frameCount++;
        const now = performance.now();
        if (now - lastFpsUpdate >= 1000) {
          fpsDisplay.textContent = `FPS: ${Math.round(frameCount * 1000 / (now - lastFpsUpdate))}`;
          frameCount = 0; lastFpsUpdate = now;
        }
        rafId = requestAnimationFrame(fpsLoop);
      }
      function startFPS() { if (!rafId) rafId = requestAnimationFrame(fpsLoop); }
      function stopFPS() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
      document.addEventListener('visibilitychange', () => document.hidden ? stopFPS() : startFPS());
      startFPS();

      let deviceData = {
        systemArch: '采集中...',
        publicIP: '获取中...',
        localIP: '获取中...',
        screen: {},
        battery: {},
        network: {},
        gpu: '检测中...',
        storage: {},
        brightness: '未知',
        mediaDevices: [],
        languages: [],
        timezone: '',
        online: navigator.onLine,
        cpuCores: navigator.hardwareConcurrency || '未知',
        memory: navigator.deviceMemory || '未知',
        ua: navigator.userAgent,
        userAgentData: null,
        sensors: {},
        peripherals: {},
        webxr: false,
        features: {},
        performanceMemory: null,
        maxTouchPoints: navigator.maxTouchPoints || 0,
        gamepads: [],
        vibration: 'vibrate' in navigator,
        payment: 'PaymentRequest' in window,
        credentials: 'credentials' in navigator,
        wakeLock: 'wakeLock' in navigator,
        webglVendor: '',
        webglRenderer: '',
        webgl2Vendor: '',
        webgl2Renderer: '',
        canvasFingerprint: '',
        plugins: [],
        mimeTypes: [],
        cookieEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack || window.doNotTrack || 'unspecified',
        javaEnabled: navigator.javaEnabled ? navigator.javaEnabled() : false,
        pdfViewer: 'application/pdf' in navigator.mimeTypes ? '支持' : '不支持',
        webdriver: navigator.webdriver ? '是' : '否',
        deviceOrientation: 'DeviceOrientationEvent' in window,
        deviceMotion: 'DeviceMotionEvent' in window,
        geolocation: 'geolocation' in navigator,
        clipboard: 'clipboard' in navigator,
        notifications: 'Notification' in window,
        pushManager: 'PushManager' in window,
        backgroundSync: 'SyncManager' in window,
        bluetoothAvailability: false,
        usbDevices: false,
        xrSupported: false,
        connectionType: '',
        connectionDownlink: '',
        connectionRtt: '',
        saveData: false,
        batteryLevel: '',
        batteryCharging: '',
        storageQuota: '',
        storageUsage: '',
        storagePercent: '',
        screenBrightness: '不支持',
        memoryInfo: null,
        fonts: [],
        audioContext: null,
        sampleRate: 0,
      };

      function safeGet(fn, fallback = '不支持') { try { return fn(); } catch (e) { return fallback; } }

      async function getLocalIP() {
        return new Promise((resolve) => {
          const pc = new RTCPeerConnection({ iceServers: [] });
          pc.createDataChannel('');
          pc.createOffer().then(offer => pc.setLocalDescription(offer));
          pc.onicecandidate = (e) => {
            if (!e.candidate) return;
            const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
            const match = e.candidate.candidate.match(ipRegex);
            if (match) { resolve(match[0]); pc.close(); }
          };
          setTimeout(() => resolve('未获取到'), 2000);
        });
      }

      async function getPublicIP() {
        try { const res = await fetch('https://api.ipify.org?format=json'); return (await res.json()).ip; }
        catch { return '获取失败'; }
      }

      async function getBatteryInfo() {
        if (!navigator.getBattery) return { level: '不支持', charging: '不支持' };
        try {
          const b = await navigator.getBattery();
          return {
            level: (b.level * 100).toFixed(0) + '%',
            charging: b.charging ? '充电中' : '未充电',
            chargingTime: b.chargingTime === Infinity ? 'N/A' : b.chargingTime + 's',
            dischargingTime: b.dischargingTime === Infinity ? 'N/A' : b.dischargingTime + 's'
          };
        } catch { return { level: '错误', charging: '错误' }; }
      }

      async function getNetworkInfo() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!conn) return { effectiveType: '不支持', downlink: '不支持', rtt: '不支持' };
        return {
          effectiveType: conn.effectiveType || '未知',
          downlink: conn.downlink ? conn.downlink + ' Mbps' : '未知',
          rtt: conn.rtt ? conn.rtt + ' ms' : '未知',
          saveData: conn.saveData ? '已开启' : '关闭'
        };
      }

      async function getStorageInfo() {
        if (!navigator.storage?.estimate) return { quota: '不支持', usage: '不支持' };
        try {
          const est = await navigator.storage.estimate();
          const quota = est.quota ? (est.quota / 1e9).toFixed(1) + ' GB' : '未知';
          const usage = est.usage ? (est.usage / 1e9).toFixed(2) + ' GB' : '未知';
          const percent = est.quota && est.usage ? ((est.usage / est.quota) * 100).toFixed(1) + '%' : 'N/A';
          return { quota, usage, percent };
        } catch { return { quota: '错误', usage: '错误' }; }
      }

      async function getMediaDevices() {
        if (!navigator.mediaDevices?.enumerateDevices) return [];
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          return devices.map(d => ({ kind: d.kind, label: d.label || '未命名', groupId: d.groupId?.slice(0,8) || '' }));
        } catch { return []; }
      }

      async function getGPUInfo() {
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (!gl) return '不支持 WebGL';
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          if (ext) {
            deviceData.webglVendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);
            deviceData.webglRenderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
            return deviceData.webglRenderer;
          }
          return 'WebGL 支持但无法获取渲染器';
        } catch { return '检测失败'; }
      }

      async function getBrightness() {
        if ('getScreenBrightness' in navigator) {
          try { const b = await navigator.getScreenBrightness(); return (b * 100).toFixed(0) + '%'; } catch {}
        }
        return '不支持';
      }

      async function getHighEntropyData() {
        if (!navigator.userAgentData?.getHighEntropyValues) return null;
        try {
          return await navigator.userAgentData.getHighEntropyValues([
            "architecture", "bitness", "model", "platform", "platformVersion", "fullVersionList"
          ]);
        } catch { return null; }
      }

      function checkSensors() {
        return {
          accelerometer: 'Accelerometer' in window,
          gyroscope: 'Gyroscope' in window,
          magnetometer: 'Magnetometer' in window,
          ambientLight: 'AmbientLightSensor' in window,
          proximity: 'ProximitySensor' in window,
          absoluteOrientation: 'AbsoluteOrientationSensor' in window,
          relativeOrientation: 'RelativeOrientationSensor' in window,
        };
      }

      function checkPeripherals() {
        return {
          bluetooth: 'bluetooth' in navigator,
          usb: 'usb' in navigator,
          serial: 'serial' in navigator,
          hid: 'hid' in navigator,
          nfc: 'NDEFReader' in window,
          midi: 'requestMIDIAccess' in navigator,
        };
      }

      function checkWebXR() { return 'xr' in navigator && 'XRSystem' in window; }

      function checkFeatures() {
        const f = {
          webGPU: 'gpu' in navigator,
          serviceWorker: 'serviceWorker' in navigator,
          webShare: 'share' in navigator,
          webBluetooth: 'bluetooth' in navigator,
          webUSB: 'usb' in navigator,
          paymentRequest: 'PaymentRequest' in window,
          credentialManagement: 'credentials' in navigator,
          contactPicker: 'contacts' in navigator,
          fileSystemAccess: 'showOpenFilePicker' in window,
          screenWakeLock: 'wakeLock' in navigator,
          clipboardRead: 'clipboard' in navigator && 'read' in navigator.clipboard,
          idleDetection: 'IdleDetector' in window,
          contentIndex: 'ContentIndex' in ServiceWorkerRegistration.prototype,
          periodicSync: 'PeriodicSyncManager' in window,
          shapeDetection: 'BarcodeDetector' in window || 'FaceDetector' in window || 'TextDetector' in window,
          virtualKeyboard: 'virtualKeyboard' in navigator,
          screenOrientation: 'orientation' in screen,
          fullscreen: document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled,
          pictureInPicture: document.pictureInPictureEnabled,
          webAuthn: 'PublicKeyCredential' in window,
          autoplay: 'autoplay' in document.createElement('video'),
        };
        return f;
      }

      function getPerformanceMemory() {
        if (performance && performance.memory) {
          return {
            jsHeapSizeLimit: (performance.memory.jsHeapSizeLimit / 1048576).toFixed(1) + ' MB',
            totalJSHeapSize: (performance.memory.totalJSHeapSize / 1048576).toFixed(1) + ' MB',
            usedJSHeapSize: (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + ' MB',
          };
        }
        return null;
      }

      function getGamepads() {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        if (!pads) return [];
        return Array.from(pads).filter(p => p).map(p => ({ id: p.id, connected: p.connected }));
      }

      function getPluginsAndMime() {
        const plugins = [];
        if (navigator.plugins) {
          for (let i = 0; i < navigator.plugins.length; i++) {
            plugins.push(navigator.plugins[i].name);
          }
        }
        const mimeTypes = [];
        if (navigator.mimeTypes) {
          for (let i = 0; i < navigator.mimeTypes.length; i++) {
            mimeTypes.push(navigator.mimeTypes[i].type);
          }
        }
        return { plugins, mimeTypes };
      }

      async function getAudioContextInfo() {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const sr = ac.sampleRate;
          await ac.close();
          return { sampleRate: sr };
        } catch { return null; }
      }

      // 主采集
      async function collectAllData() {
        const [
          publicIP, localIP, batteryInfo, networkInfo, storageInfo,
          mediaDevices, gpuInfo, brightnessVal, highEntropyData,
          audioCtxInfo
        ] = await Promise.all([
          getPublicIP(), getLocalIP(), getBatteryInfo(), getNetworkInfo(),
          getStorageInfo(), getMediaDevices(), getGPUInfo(), getBrightness(),
          getHighEntropyData(), getAudioContextInfo()
        ]);

        deviceData.publicIP = publicIP;
        deviceData.localIP = localIP;
        deviceData.battery = batteryInfo;
        deviceData.network = networkInfo;
        deviceData.storage = storageInfo;
        deviceData.mediaDevices = mediaDevices;
        deviceData.gpu = gpuInfo;
        deviceData.brightness = brightnessVal;
        deviceData.userAgentData = highEntropyData;
        deviceData.sensors = checkSensors();
        deviceData.peripherals = checkPeripherals();
        deviceData.webxr = checkWebXR();
        deviceData.features = checkFeatures();
        deviceData.performanceMemory = getPerformanceMemory();
        deviceData.maxTouchPoints = navigator.maxTouchPoints || 0;
        deviceData.gamepads = getGamepads();
        deviceData.vibration = 'vibrate' in navigator;
        deviceData.payment = 'PaymentRequest' in window;
        deviceData.credentials = 'credentials' in navigator;
        deviceData.wakeLock = 'wakeLock' in navigator;
        const pluginInfo = getPluginsAndMime();
        deviceData.plugins = pluginInfo.plugins;
        deviceData.mimeTypes = pluginInfo.mimeTypes;
        deviceData.cookieEnabled = navigator.cookieEnabled;
        deviceData.doNotTrack = navigator.doNotTrack || window.doNotTrack || 'unspecified';
        deviceData.javaEnabled = navigator.javaEnabled ? navigator.javaEnabled() : false;
        deviceData.webdriver = navigator.webdriver ? '是' : '否';
        deviceData.deviceOrientation = 'DeviceOrientationEvent' in window;
        deviceData.deviceMotion = 'DeviceMotionEvent' in window;
        deviceData.geolocation = 'geolocation' in navigator;
        deviceData.clipboard = 'clipboard' in navigator;
        deviceData.notifications = 'Notification' in window;
        deviceData.pushManager = 'PushManager' in window;
        deviceData.backgroundSync = 'SyncManager' in window;
        if (audioCtxInfo) deviceData.sampleRate = audioCtxInfo.sampleRate;
        deviceData.languages = navigator.languages || [navigator.language];
        deviceData.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // 屏幕
        deviceData.screen = {
          logical: `${window.screen.width}x${window.screen.height}`,
          physical: `${window.screen.width * window.devicePixelRatio}x${window.screen.height * window.devicePixelRatio}`,
          dpr: window.devicePixelRatio,
          viewport: `${window.innerWidth}x${window.innerHeight}`,
          colorDepth: window.screen.colorDepth,
          pixelDepth: window.screen.pixelDepth,
          availWidth: window.screen.availWidth,
          availHeight: window.screen.availHeight,
          orientation: screen.orientation ? screen.orientation.type : '不支持'
        };

        // 系统架构
        if (highEntropyData) {
          let archStr = highEntropyData.platform || '未知平台';
          if (highEntropyData.architecture) archStr += ` (${highEntropyData.architecture})`;
          if (highEntropyData.bitness) archStr += ` ${highEntropyData.bitness}位`;
          if (highEntropyData.platformVersion) archStr += ` v${highEntropyData.platformVersion}`;
          if (highEntropyData.fullVersionList?.length) {
            const brands = highEntropyData.fullVersionList.map(b => `${b.brand} ${b.version}`).join(' / ');
            archStr += ` [${brands}]`;
          }
          deviceData.systemArch = archStr;
        } else {
          deviceData.systemArch = navigator.platform || '未知';
        }

        updateAllUI();
      }

      function updateAllUI() {
        updateBasicUI();
        document.getElementById('uaFull').textContent = 'UA: ' + deviceData.ua;
        updateOpenModalIfAny();
      }

      function updateBasicUI() {
        const grid = document.getElementById('basicInfoGrid');
        const d = deviceData;
        const items = [
          ['系统架构', d.systemArch],
          ['公网 IP', d.publicIP],
          ['本地 IP', d.localIP],
          ['屏幕(逻辑)', d.screen.logical],
          ['屏幕(物理)', d.screen.physical],
          ['DPR', d.screen.dpr],
          ['视口', d.screen.viewport],
          ['颜色深度', d.screen.colorDepth],
          ['像素深度', d.screen.pixelDepth],
          ['可用屏幕宽', d.screen.availWidth],
          ['可用屏幕高', d.screen.availHeight],
          ['屏幕方向', d.screen.orientation],
          ['电池', (d.battery.level || '') + ' · ' + (d.battery.charging || '')],
          ['网络类型', d.network.effectiveType || '未知'],
          ['下行带宽', d.network.downlink],
          ['RTT', d.network.rtt],
          ['省流量', d.network.saveData],
          ['GPU', d.gpu],
          ['WebGL 供应商', d.webglVendor || '未获取'],
          ['WebGL 渲染器', d.webglRenderer || '未获取'],
          ['存储(已用/总额)', (d.storage.usage || '') + ' / ' + (d.storage.quota || '')],
          ['存储使用率', d.storage.percent],
          ['亮度', d.brightness],
          ['语言(列表)', d.languages.join(', ')],
          ['时区', d.timezone],
          ['在线状态', d.online ? '在线' : '离线'],
          ['CPU核心', d.cpuCores],
          ['设备内存(GB)', d.memory],
          ['最大触摸点', d.maxTouchPoints],
          ['振动支持', d.vibration ? '是' : '否'],
          ['支付请求', d.payment ? '是' : '否'],
          ['凭据管理', d.credentials ? '是' : '否'],
          ['屏幕唤醒锁', d.wakeLock ? '是' : '否'],
          ['WebDriver', d.webdriver],
          ['Cookie启用', d.cookieEnabled ? '是' : '否'],
          ['Do Not Track', d.doNotTrack],
          ['Java启用', d.javaEnabled ? '是' : '否'],
          ['设备方向', d.deviceOrientation ? '是' : '否'],
          ['设备运动', d.deviceMotion ? '是' : '否'],
          ['地理定位', d.geolocation ? '是' : '否'],
          ['剪贴板', d.clipboard ? '是' : '否'],
          ['通知', d.notifications ? '是' : '否'],
          ['推送管理', d.pushManager ? '是' : '否'],
          ['后台同步', d.backgroundSync ? '是' : '否'],
          ['音频采样率', d.sampleRate ? d.sampleRate + ' Hz' : '未获取'],
          ['游戏手柄', d.gamepads.length > 0 ? d.gamepads.map(g => g.id).join(', ') : '无'],
        ];
        if (d.performanceMemory) {
          items.push(['JS堆大小限制', d.performanceMemory.jsHeapSizeLimit]);
          items.push(['JS堆总大小', d.performanceMemory.totalJSHeapSize]);
          items.push(['JS堆已用', d.performanceMemory.usedJSHeapSize]);
        }
        grid.innerHTML = items.map(([label, value]) => `
          <div class="info-card">
            <div class="label">${label}</div>
            <div class="value">${value}</div>
          </div>
        `).join('');
      }

      // 模态框分类（更多分类）
      const modalCategories = [
        { id: 'battery', title: '电池详情' },
        { id: 'network', title: '网络详情' },
        { id: 'storage', title: '存储详情' },
        { id: 'brightness', title: '屏幕亮度' },
        { id: 'media', title: '媒体设备' },
        { id: 'language', title: '语言与时区' },
        { id: 'online', title: '在线状态' },
        { id: 'cpu', title: 'CPU 与内存' },
        { id: 'gpu', title: 'GPU 信息' },
        { id: 'sensors', title: '传感器支持' },
        { id: 'peripherals', title: '外设支持' },
        { id: 'webxr', title: 'WebXR' },
        { id: 'features', title: '系统特性' },
        { id: 'plugins', title: '插件与MIME' },
        { id: 'screen', title: '屏幕详细' },
        { id: 'performance', title: '性能内存' },
        { id: 'gamepad', title: '游戏手柄' },
        { id: 'misc', title: '杂项' }
      ];

      const triggerContainer = document.getElementById('modalTriggers');
      modalCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.title;
        btn.addEventListener('click', () => openModal(cat));
        triggerContainer.appendChild(btn);
      });

      const deviceModal = document.getElementById('deviceModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');
      const modalCloseBtn = document.getElementById('modalCloseBtn');
      let currentModalId = null;

      function openModal(cat) {
        currentModalId = cat.id;
        modalTitle.textContent = cat.title;
        updateModalContent(cat.id);
        deviceModal.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        deviceModal.classList.remove('show');
        document.body.style.overflow = '';
        currentModalId = null;
      }

      modalCloseBtn.addEventListener('click', closeModal);
      deviceModal.addEventListener('click', (e) => { if (e.target === deviceModal) closeModal(); });

      function updateModalContent(id) {
        const d = deviceData;
        let html = '';
        const row = (l, v) => `<div class="detail-item"><span class="d-label">${l}</span><span class="d-value">${v}</span></div>`;
        switch(id) {
          case 'battery':
            html = row('电量', d.battery.level) + row('充电状态', d.battery.charging) + row('充电时间', d.battery.chargingTime) + row('放电时间', d.battery.dischargingTime);
            break;
          case 'network':
            html = row('网络类型', d.network.effectiveType) + row('下行带宽', d.network.downlink) + row('RTT', d.network.rtt) + row('省流量模式', d.network.saveData);
            break;
          case 'storage':
            html = row('已用空间', d.storage.usage) + row('总额配额', d.storage.quota) + row('使用率', d.storage.percent);
            break;
          case 'brightness':
            html = row('屏幕亮度', d.brightness);
            break;
          case 'media':
            if (!d.mediaDevices.length) html = '<p>无媒体设备信息或权限未授予</p>';
            else html = d.mediaDevices.map(m => row(m.kind, m.label)).join('');
            break;
          case 'language':
            html = row('语言列表', d.languages.join(', ')) + row('时区', d.timezone) + row('日期格式', new Intl.DateTimeFormat().format(new Date()));
            break;
          case 'online':
            html = row('状态', d.online ? '在线' : '离线');
            break;
          case 'cpu':
            html = row('逻辑核心数', d.cpuCores) + row('设备内存(GB)', d.memory) + row('UA', d.ua);
            break;
          case 'gpu':
            html = row('GPU 渲染器', d.gpu) + row('WebGL 供应商', d.webglVendor || '未知') + row('WebGL 渲染器', d.webglRenderer || '未知');
            if (d.features.webGPU) html += '<p>WebGPU 已支持</p>'; else html += '<p>WebGPU 未支持或需开启 flag</p>';
            break;
          case 'sensors':
            html = Object.entries(d.sensors).map(([k,v]) => row(k, v ? '支持' : '不支持')).join('');
            break;
          case 'peripherals':
            html = Object.entries(d.peripherals).map(([k,v]) => row(k, v ? '支持' : '不支持')).join('');
            break;
          case 'webxr':
            html = row('WebXR 支持', d.webxr ? '支持' : '不支持');
            break;
          case 'features':
            html = Object.entries(d.features).map(([k,v]) => row(k, v ? '支持' : '不支持')).join('');
            break;
          case 'plugins':
            html = row('插件数量', d.plugins.length);
            html += d.plugins.map(p => row('插件', p)).join('');
            html += row('MIME类型数量', d.mimeTypes.length);
            html += d.mimeTypes.slice(0,10).map(m => row('MIME', m)).join('');
            if (d.mimeTypes.length > 10) html += row('...', `共 ${d.mimeTypes.length} 项`);
            break;
          case 'screen':
            html = row('逻辑尺寸', d.screen.logical) + row('物理尺寸', d.screen.physical) + row('DPR', d.screen.dpr) + row('视口', d.screen.viewport) + row('颜色深度', d.screen.colorDepth) + row('像素深度', d.screen.pixelDepth) + row('可用宽', d.screen.availWidth) + row('可用高', d.screen.availHeight) + row('方向', d.screen.orientation);
            break;
          case 'performance':
            if (d.performanceMemory) {
              html = row('JS堆大小限制', d.performanceMemory.jsHeapSizeLimit) + row('JS堆总大小', d.performanceMemory.totalJSHeapSize) + row('JS堆已用', d.performanceMemory.usedJSHeapSize);
            } else {
              html = '<p>性能内存信息不可用</p>';
            }
            break;
          case 'gamepad':
            if (d.gamepads.length === 0) html = '<p>未检测到游戏手柄</p>';
            else html = d.gamepads.map(g => row(g.id, g.connected ? '已连接' : '未连接')).join('');
            break;
          case 'misc':
            html = row('WebDriver', d.webdriver) + row('Cookie', d.cookieEnabled ? '是' : '否') + row('DNT', d.doNotTrack) + row('Java', d.javaEnabled ? '是' : '否') + row('PDF查看器', d.pdfViewer) + row('振动', d.vibration ? '是' : '否') + row('支付', d.payment ? '是' : '否') + row('凭据', d.credentials ? '是' : '否') + row('唤醒锁', d.wakeLock ? '是' : '否') + row('设备方向事件', d.deviceOrientation ? '是' : '否') + row('设备运动事件', d.deviceMotion ? '是' : '否') + row('地理定位', d.geolocation ? '是' : '否') + row('剪贴板', d.clipboard ? '是' : '否') + row('通知', d.notifications ? '是' : '否') + row('推送管理', d.pushManager ? '是' : '否') + row('后台同步', d.backgroundSync ? '是' : '否');
            break;
        }
        modalBody.innerHTML = html;
      }

      function updateOpenModalIfAny() {
        if (currentModalId) updateModalContent(currentModalId);
      }

      // 实时刷新（每秒）
      async function liveUpdate() {
        if (navigator.getBattery) {
          try {
            const b = await navigator.getBattery();
            deviceData.battery.level = (b.level * 100).toFixed(0) + '%';
            deviceData.battery.charging = b.charging ? '充电中' : '未充电';
            deviceData.battery.chargingTime = b.chargingTime === Infinity ? 'N/A' : b.chargingTime + 's';
            deviceData.battery.dischargingTime = b.dischargingTime === Infinity ? 'N/A' : b.dischargingTime + 's';
          } catch {}
        }
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
          deviceData.network.effectiveType = conn.effectiveType;
          deviceData.network.downlink = conn.downlink ? conn.downlink + ' Mbps' : '未知';
          deviceData.network.rtt = conn.rtt ? conn.rtt + ' ms' : '未知';
          deviceData.network.saveData = conn.saveData ? '已开启' : '关闭';
        }
        deviceData.online = navigator.onLine;
        if (navigator.storage?.estimate) {
          try {
            const est = await navigator.storage.estimate();
            deviceData.storage.usage = est.usage ? (est.usage / 1e9).toFixed(2) + ' GB' : '未知';
            deviceData.storage.quota = est.quota ? (est.quota / 1e9).toFixed(1) + ' GB' : '未知';
            const pct = est.quota && est.usage ? ((est.usage / est.quota)*100).toFixed(1)+'%' : 'N/A';
            deviceData.storage.percent = pct;
          } catch {}
        }
        if ('getScreenBrightness' in navigator) {
          try { const b = await navigator.getScreenBrightness(); deviceData.brightness = (b*100).toFixed(0)+'%'; } catch {}
        }
        if (performance && performance.memory) {
          deviceData.performanceMemory = {
            jsHeapSizeLimit: (performance.memory.jsHeapSizeLimit / 1048576).toFixed(1) + ' MB',
            totalJSHeapSize: (performance.memory.totalJSHeapSize / 1048576).toFixed(1) + ' MB',
            usedJSHeapSize: (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + ' MB',
          };
        }
        updateAllUI();
      }

      setInterval(liveUpdate, 1000);

      document.getElementById('refreshAllBtn').addEventListener('click', collectAllData);

      window.addEventListener('online', () => { deviceData.online = true; updateAllUI(); });
      window.addEventListener('offline', () => { deviceData.online = false; updateAllUI(); });

      setTimeout(collectAllData, 100);
      window.addEventListener('load', updatePanelScale);
    })();
  </script>
</body>
</html>
